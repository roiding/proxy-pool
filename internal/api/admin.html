<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proxy-pool 管理台</title>
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --edge: #d8d2c4; --edge-strong: #b8b0a0;
  --ink: #26221a; --dim: #6f6a5e; --accent: #1f6f50; --accent-ink: #fffdf8;
  --warn: #9a6b1f; --bad: #a33d30; --info: #2b5d8a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background:
    linear-gradient(180deg, #efe9dd 0%, transparent 240px),
    var(--bg);
  color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.6;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 20px; border-bottom: 1px solid var(--edge); background: var(--panel);
}
header h1 { font-size: 15px; margin: 0 12px 0 0; letter-spacing: .08em; font-family: var(--mono); }
header h1 b { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  border: 1px solid transparent; background: transparent; border-radius: 6px;
  padding: 5px 12px; cursor: pointer; color: var(--dim);
}
nav button:hover { color: var(--ink); background: #efe9dd; }
nav button[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }
header .spacer { flex: 1; }
header .ghost {
  border: 1px solid var(--edge-strong); background: transparent; border-radius: 6px;
  padding: 4px 12px; cursor: pointer; color: var(--dim);
}
header .ghost:hover { color: var(--ink); border-color: var(--ink); }
main { max-width: 1200px; margin: 0 auto; padding: 20px; }
section.view > p.hint { color: var(--dim); font-size: 12px; margin: 0 0 14px; }
.panel {
  background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
  padding: 16px; margin-bottom: 18px;
}
.panel h2 { font-size: 13px; margin: 0 0 12px; color: var(--dim); font-weight: 600; letter-spacing: .08em; }
.grid2 { display: grid; grid-template-columns: minmax(280px, 2fr) minmax(320px, 3fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
label { display: block; margin: 10px 0 3px; color: var(--dim); font-size: 12px; }
input[type=text], input[type=number], input[type=password], select, textarea {
  width: 100%; background: #fbf8f1; border: 1px solid var(--edge-strong);
  border-radius: 6px; padding: 7px 9px;
}
textarea { min-height: 96px; resize: vertical; font-family: var(--mono); font-size: 12px; }
.row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
.btn {
  border: 1px solid var(--edge-strong); background: var(--panel); border-radius: 6px;
  padding: 5px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger:hover { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table-wrap { width: 100%; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table .mono { overflow-wrap: anywhere; word-break: break-word; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--edge); vertical-align: top; }
th { color: var(--dim); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; font-family: var(--mono); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: #f3efe5; }
tbody tr.selected { background: #e7efe9; }
.mono { font-family: var(--mono); font-size: 12px; }
.ok { color: var(--accent); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--dim); }
.badge {
  display: inline-block; padding: 0 8px; border: 1px solid var(--edge-strong);
  border-radius: 10px; font-size: 11px; color: var(--dim); white-space: nowrap;
}
.badge.good { color: var(--accent); border-color: var(--accent); }
.badge.warn { color: var(--warn); border-color: var(--warn); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.stat { background: #fbf8f1; border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; }
.stat .v { font-size: 20px; font-family: var(--mono); }
.stat .k { font-size: 11px; color: var(--dim); }
.notice {
  border: 1px dashed var(--edge-strong); border-radius: 8px; padding: 8px 12px;
  font-size: 12px; color: var(--dim); margin: 10px 0 0;
}
.msg { margin-top: 10px; font-size: 12px; min-height: 18px; }
.msg.err { color: var(--bad); } .msg.good { color: var(--accent); } .msg.info { color: var(--info); }
.pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--dim); }
.pager button { padding: 2px 10px; }
pre.json {
  background: #fbf8f1; border: 1px solid var(--edge); border-radius: 8px;
  padding: 10px; font-size: 12px; overflow: auto; max-height: 260px; font-family: var(--mono);
}
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 13px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; font-family: var(--mono); }
#login {
  position: fixed; inset: 0; background: rgba(40,36,28,.55);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
#login[hidden] { display: none !important; }
#login .panel { width: 100%; max-width: 360px; }
.clearrow { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--dim); }
.clearrow input { width: auto; }
.tokenbox { background: #efe9dd; border: 1px solid var(--warn); border-radius: 8px; padding: 10px; font-family: var(--mono); word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>proxy<b>-</b>pool 管理台</h1>
  <nav id="nav" aria-label="主导航"></nav>
  <span class="spacer"></span>
  <button class="ghost" id="refreshBtn">刷新</button>
  <button class="ghost" id="logoutBtn">退出</button>
</header>
<main>
  <section class="view" id="view-overview" hidden></section>
  <section class="view" id="view-sources" hidden></section>
  <section class="view" id="view-inventory" hidden></section>
  <section class="view" id="view-jobs" hidden></section>
  <section class="view" id="view-projects" hidden></section>
  <section class="view" id="view-sessions" hidden></section>
  <section class="view" id="view-alerts" hidden></section>
  <section class="view" id="view-system" hidden></section>
</main>
<div id="login" hidden>
  <div class="panel">
    <h2>管理登录</h2>
    <form id="loginForm">
      <label for="loginToken">管理密码（未配置 admin_password 时填 api_token）</label>
      <input type="password" id="loginToken" autocomplete="current-password" required>
      <div class="msg" id="loginMsg"></div>
      <div style="margin-top:12px"><button class="btn primary" type="submit">进入管理台</button></div>
    </form>
  </div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* ---------- 基础设施 ---------- */

async function api(path, opts = {}) {
  opts.credentials = "same-origin";
  opts.headers = Object.assign({}, opts.headers);
  if ((opts.method || "GET") !== "GET") opts.headers["X-PP-Admin"] = "1";
  const resp = await fetch(path, opts);
  if (resp.status === 401) { showLogin("会话已过期，请重新登录"); throw new Error("unauthorized"); }
  let data = null;
  const text = await resp.text();
  if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
  if (!resp.ok) {
    const detail = data && data.error ? (data.error.code + ": " + data.error.message) : (text || resp.status);
    const err = new Error(detail);
    err.status = resp.status;
    err.code = data && data.error ? data.error.code : "";
    throw err;
  }
  return data;
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children) {
    if (child === null || child === undefined) continue;
    node.append(child);
  }
  return node;
}

function fmtTime(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleString();
}

function setMsg(node, text, kind) {
  node.textContent = text;
  node.className = "msg " + (kind || "");
}

function jobBadge(state) {
  const cls = { COMPLETED: "good", PARTIAL: "warn", RUNNING: "warn", PENDING: "warn",
    FAILED: "bad", CANCELLED: "bad", INTERRUPTED: "bad" }[state] || "";
  return el("span", { class: "badge " + cls, text: state || "—" });
}

function pager(container, totalFn) {
  let page = 1;
  const size = 20;
  const info = el("span");
  const prev = el("button", { class: "btn", text: "上一页", onclick: () => { if (page > 1) { page--; render(); } } });
  const next = el("button", { class: "btn", text: "下一页", onclick: () => { page++; render(); } });
  const root = el("div", { class: "pager" }, prev, info, next);
  function render() {
    const total = totalFn();
    const pages = Math.max(1, Math.ceil(total / size));
    if (page > pages) page = pages;
    info.textContent = "第 " + page + " / " + pages + " 页，共 " + total + " 条";
    prev.disabled = page <= 1;
    next.disabled = page >= pages;
    root.dispatchEvent(new CustomEvent("pagechange", { detail: { page, size } }));
  }
  root.go = () => { page = 1; render(); };
  root.render = render;
  root.page = () => ({ page, size });
  container.append(root);
  return root;
}

function table(head) {
  const tbody = el("tbody");
  const node = el("table", {},
    el("thead", {}, el("tr", {}, ...head.map((h) =>
      el("th", { class: h.num ? "num" : "", text: h.label })))));
  node.append(tbody);
  const root = el("div", { class: "table-wrap" }, node);
  root.body = tbody;
  return root;
}

/* ---------- 登录 ---------- */

function showLogin(msg) {
  $("login").hidden = false;
  $("loginToken").focus();
  setMsg($("loginMsg"), msg || "", msg ? "err" : "");
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const resp = await fetch("/admin/login", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: $("loginToken").value }),
    });
    if (resp.ok) {
      $("loginToken").value = "";
      $("login").hidden = true;
      refreshCurrent();
    } else {
      setMsg($("loginMsg"), "登录失败：密码不正确", "err");
    }
  } catch (err) {
    setMsg($("loginMsg"), "登录请求失败：" + err.message, "err");
  }
});

$("logoutBtn").addEventListener("click", async () => {
  await fetch("/admin/logout", { method: "POST", credentials: "same-origin" }).catch(() => {});
  showLogin("已退出");
});

/* ---------- 导航 ---------- */

const VIEWS = [
  ["overview", "概览"], ["sources", "渠道"], ["inventory", "本地库存"],
  ["jobs", "任务"], ["projects", "下游项目"], ["sessions", "会话"],
  ["alerts", "流量告警"], ["system", "系统"],
];
let currentView = "overview";

for (const [id, label] of VIEWS) {
  const btn = el("button", {
    text: label, type: "button",
    onclick: () => switchView(id),
  });
  btn.dataset.view = id;
  $("nav").append(btn);
}

function switchView(id) {
  currentView = id;
  for (const [vid] of VIEWS) {
    $("view-" + vid).hidden = vid !== id;
  }
  for (const btn of $("nav").children) {
    if (btn.dataset.view === id) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  }
  refreshCurrent();
}

$("refreshBtn").addEventListener("click", refreshCurrent);

/* ---------- 视图刷新 ---------- */

function refreshCurrent() {
  const fn = { overview: renderOverview, sources: renderSources, inventory: renderInventory,
    jobs: renderJobs, projects: renderProjects, sessions: renderSessions,
    alerts: renderAlerts, system: renderSystem }[currentView];
  if (fn) Promise.resolve(fn()).catch((err) => {
    if (err.message !== "unauthorized") console.error(err);
  });
}

/* ---------- 概览 ---------- */

async function renderOverview() {
  const root = $("view-overview");
  root.textContent = "";
  root.append(el("p", { class: "hint", text: "实时取号表现、验证状态与最近任务。所有数字来自当前数据库统计，不包含估算。" }));
  const statsPanel = el("div", { class: "panel" }, el("h2", { text: "池子状态" }));
  const statsBox = el("div", { class: "stats", text: "加载中…" });
  statsPanel.append(statsBox);
  const valPanel = el("div", { class: "panel" }, el("h2", { text: "定期验活" }));
  const valBox = el("div", { class: "muted", text: "加载中…" });
  valPanel.append(valBox);
  const jobsPanel = el("div", { class: "panel" }, el("h2", { text: "最近任务" }));
  const jobsBox = el("div", { text: "加载中…" });
  jobsPanel.append(jobsBox);
  root.append(statsPanel, el("div", { class: "grid2" }, valPanel, jobsPanel));
  const stats = await api("/api/v1/admin/stats");
  statsBox.textContent = "";
  for (const [k, v] of [
    ["渠道", stats.sources], ["资源", stats.resources], ["有效供给", stats.enabled_offers],
    ["活跃租约", stats.active_leases], ["进行中预约", stats.active_reservations],
    ["健康通过", stats.health_pass], ["健康失败", stats.health_fail],
  ]) {
    statsBox.append(el("div", { class: "stat" },
      el("div", { class: "v", text: String(v) }), el("div", { class: "k", text: k })));
  }
  const val = await api("/api/v1/admin/validation");
  valBox.textContent = "";
  if (val.running) {
    valBox.append(el("div", { class: "warn", text: "验证进行中" + (val.source_id ? "（渠道 " + val.source_id + "）" : "（全部渠道）") }));
  } else if (val.last_finished_at) {
    valBox.append(el("div", { text: "上次完成：" + fmtTime(val.last_finished_at) }));
  } else {
    valBox.append(el("div", { class: "muted", text: "尚未运行验证（每晚自动一次，也可在渠道详情手动触发）" }));
  }
  valBox.append(el("div", { class: "muted", text: "探测 " + (val.probed ?? 0) + " · 清理 " + (val.retired ?? 0) }));
  const jobs = await api("/api/v1/admin/jobs?limit=8");
  jobsBox.textContent = "";
  const jt = table([{ label: "任务" }, { label: "项目" }, { label: "状态" }, { label: "达标/目标" }, { label: "更新" }]);
  if (!jobs.length) jt.body.append(el("tr", {}, el("td", { colspan: "5", class: "muted", text: "暂无任务" })));
  for (const j of jobs) {
    jt.body.append(el("tr", {},
      el("td", { class: "mono", text: j.job_id }),
      el("td", { class: "mono", text: j.project_id }),
      el("td", {}, jobBadge(j.state)),
      el("td", { class: "num", text: j.ready + "/" + j.target }),
      el("td", { text: fmtTime(j.updated_at) })));
  }
  jobsBox.append(jt);
  const usage = await api("/api/v1/admin/usage").catch(() => null);
  if (usage) {
    const up = el("div", { class: "panel" }, el("h2", { text: "云用量（最近一次查询）" }));
    if (usage.snapshot) {
      up.append(el("div", {},
        el("span", { text: "已用 " + usage.snapshot.used_gb + " GB / " + usage.snapshot.total_gb + " GB · " }),
        usage.stale ? el("span", { class: "warn", text: "数据已过期" })
                    : el("span", { class: "ok", text: "数据时间 " + fmtTime(usage.snapshot.as_of) })));
    } else {
      up.append(el("div", { class: "muted", text: usage.last_error || "暂无用量数据（尚未取得官方流量口径）" }));
    }
    root.append(up);
  }
}

/* ---------- 渠道 ---------- */

const sourceState = { list: [], adapters: [], selected: null, detail: null, requestSeq: 0 };

async function renderSources() {
  const root = $("view-sources");
  if (!root.dataset.built) {
    root.textContent = "";
    root.append(el("p", { class: "hint", text: "渠道实例与其适配器是两回事：适配器能力由代码注册，实例可以多个、可启停。保存配置不会触发抓取。" }));
    const grid = el("div", { class: "grid2" });
    const left = el("div", { class: "panel" }, el("h2", { text: "渠道实例" }));
    const srcTable = table([{ label: "ID" }, { label: "适配器" }, { label: "启停" }, { label: "有效供给" }, { label: "熔断" }]);
    left.append(srcTable);
    const pagerBox = el("div");
    left.append(pagerBox);
    const right = el("div", {});
    const detailPanel = el("div", { class: "panel" }, el("h2", { text: "渠道详情" }),
      el("div", { class: "muted", text: "左侧选择一个渠道查看配置与操作。" }));
    const createPanel = el("div", { class: "panel" }, el("h2", { text: "新建渠道" }));
    buildSourceCreateForm(createPanel);
    right.append(detailPanel, createPanel);
    grid.append(left, right);
    root.dataset.built = "1";
    root._table = srcTable;
    root._pager = pager(pagerBox, () => sourceState.list.length);
    root._pager.addEventListener("pagechange", () => paintSourceRows());
    root._detail = detailPanel;
    const uploadKeys = uploadKeysPanel();
    root._ukTable = uploadKeys._table;
    root.append(grid, uploadKeys);
  }
  const [overviews, adapters] = await Promise.all([
    api("/api/v1/admin/sources"), api("/api/v1/admin/adapters")]);
  sourceState.list = overviews || [];
  sourceState.adapters = (adapters && adapters.adapters) || [];
  root._pager.go();
  paintUploadKeys(root._ukTable);
}

function uploadKeysPanel() {
  const panel = el("div", { class: "panel", style: "margin-top:16px" }, el("h2", { text: "上传密钥" }));
  const tbl = table([{ label: "Key" }, { label: "名称" }, { label: "前缀" }, { label: "来源" }, { label: "启停" }, { label: "操作" }]);
  const name = el("input", { type: "text", placeholder: "新上传密钥名称" });
  const sources = el("input", { type: "text", placeholder: "来源 source_id，逗号分隔" });
  const btn = el("button", { class: "btn", text: "创建上传密钥", type: "button" });
  const msg = el("div", { class: "msg" });
  const tokenBox = el("div", { class: "tokenbox", hidden: "" });
  btn.addEventListener("click", async () => {
    if (!name.value.trim()) { setMsg(msg, "请填写密钥名称", "err"); return; }
    const ids = sources.value.split(/[,\n]/).map((s) => s.trim()).filter(Boolean);
    try {
      const res = await api("/api/v1/admin/upload-keys", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name.value.trim(), source_ids: ids }) });
      tokenBox.hidden = false;
      tokenBox.textContent = "新上传密钥（仅本次显示）：" + res.token;
      name.value = ""; sources.value = "";
      paintUploadKeys(tbl);
    } catch (err) { setMsg(msg, "创建失败：" + err.message, "err"); }
  });
  panel.append(tbl, el("div", { class: "row", style: "margin-top:8px" }, name, sources, btn), tokenBox, msg);
  panel._table = tbl;
  paintUploadKeys(tbl);
  return panel;
}

async function paintUploadKeys(tbl) {
  try {
    const keys = await api("/api/v1/admin/upload-keys");
    tbl.body.textContent = "";
    if (!keys.length) tbl.body.append(el("tr", {}, el("td", { colspan: "6", class: "muted", text: "暂无上传密钥" })));
    for (const k of keys) {
      tbl.body.append(el("tr", {},
        el("td", { class: "mono", text: k.key_id }),
        el("td", { text: k.name }),
        el("td", { class: "mono", text: k.token_prefix + "…" }),
        el("td", { class: "mono", text: (k.source_ids || []).join(", ") }),
        el("td", {}, el("span", { class: k.enabled ? "ok" : "muted", text: k.enabled ? "启用" : "停用" })),
        el("td", {},
          el("button", { class: k.enabled ? "btn" : "btn primary", text: k.enabled ? "停用" : "启用", type: "button",
            onclick: async () => {
              try {
                await api("/api/v1/admin/upload-keys/" + encodeURIComponent(k.key_id), {
                  method: "PATCH", headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ enabled: !k.enabled }) });
                paintUploadKeys(tbl);
              } catch (err) { alert("操作失败：" + err.message); }
            } }),
          el("button", { class: "btn danger", text: "删除", type: "button",
            onclick: async () => {
              if (!confirm("删除上传密钥 " + k.key_id + "？使用它的导入程序将立即失效。")) return;
              try {
                await api("/api/v1/admin/upload-keys/" + encodeURIComponent(k.key_id), { method: "DELETE" });
                paintUploadKeys(tbl);
              } catch (err) { alert("删除失败：" + err.message); }
            } }))));
    }
  } catch (err) {
    tbl.body.textContent = "";
    tbl.body.append(el("tr", {}, el("td", { colspan: "6", class: "bad", text: "读取失败：" + err.message })));
  }
}

function paintSourceRows() {
  const root = $("view-sources");
  const { page, size } = root._pager.page();
  const tbl = root._table;
  tbl.body.textContent = "";
  const rows = sourceState.list.slice((page - 1) * size, page * size);
  if (!rows.length) tbl.body.append(el("tr", {}, el("td", { colspan: "5", class: "muted", text: "暂无渠道" })));
  for (const s of rows) {
    const tr = el("tr", { class: "click" + (sourceState.selected === s.source_id ? " selected" : ""),
      onclick: () => selectSource(s.source_id) },
      el("td", { class: "mono", text: s.source_id }),
      el("td", { text: s.adapter_type }),
      el("td", {}, el("span", { class: s.enabled ? "ok" : "muted", text: s.enabled ? "启用" : "停用" })),
      el("td", { class: "num", text: String(s.enabled_offers) }),
      el("td", {}, el("span", { class: s.circuit_state === "OPEN" ? "warn" : "muted", text: s.circuit_state || "CLOSED" })));
    tbl.body.append(tr);
  }
}

async function selectSource(id) {
  const seq = ++sourceState.requestSeq;
  sourceState.selected = id;
  paintSourceRows();
  await paintSourceDetail("", seq);
}

async function paintSourceDetail(errText, requestSeq) {
  const seq = requestSeq === undefined ? ++sourceState.requestSeq : requestSeq;
  const panel = $("view-sources")._detail;
  panel.textContent = "";
  panel.append(el("h2", { text: "渠道详情" }));
  if (!sourceState.selected) {
    panel.append(el("div", { class: "muted", text: "左侧选择一个渠道查看配置与操作。" }));
    return;
  }
  const id = sourceState.selected;
  const msg = el("div", { class: "msg" });
  if (errText) setMsg(msg, errText, "err");
  let detail;
  try {
    detail = await api("/api/v1/admin/sources/" + encodeURIComponent(id));
  } catch (err) {
    if (seq !== sourceState.requestSeq || sourceState.selected !== id) return;
    panel.append(el("div", { class: "bad", text: "读取失败：" + err.message }));
    return;
  }
  if (seq !== sourceState.requestSeq || sourceState.selected !== id) return;
  sourceState.detail = detail;
  const overview = sourceState.list.find((s) => s.source_id === id) || {};
  panel.append(el("dl", { class: "kv" },
    el("dt", { text: "ID" }), el("dd", { class: "mono", text: detail.source_id }),
    el("dt", { text: "适配器" }), el("dd", { class: "mono", text: detail.adapter_type + " / " + detail.parser_type }),
    el("dt", { text: "配置版本" }), el("dd", { class: "mono", text: String(detail.config_version) }),
    el("dt", { text: "库存/有效" }), el("dd", { class: "mono", text: (overview.offers ?? "—") + " / " + (overview.enabled_offers ?? "—") }),
    el("dt", { text: "健康通过/失败" }), el("dd", { class: "mono", text: (overview.health_pass ?? "—") + " / " + (overview.health_fail ?? "—") }),
    el("dt", { text: "最近验活" }), el("dd", { class: "mono", text: fmtTime(overview.last_validated_at) }),
    el("dt", { text: "熔断" }), el("dd", { class: "mono", text: (overview.circuit_state || "CLOSED") +
      (overview.source_cooldown_until ? "（至 " + fmtTime(overview.source_cooldown_until) + "）" : "") })));
  const cfgLabel = el("label", { text: "配置 JSON（保存以 config_version=" + detail.config_version + " 为基准，冲突时需刷新）" });
  const cfgBox = el("textarea", { spellcheck: "false" });
  cfgBox.value = JSON.stringify(detail.config ?? {}, null, 2);
  const saveBtn = el("button", { class: "btn primary", text: "保存配置", type: "button" });
  const enableBtn = el("button", { class: "btn", text: detail.enabled ? "停用渠道" : "启用渠道", type: "button" });
  const delBtn = el("button", { class: "btn danger", text: "删除渠道", type: "button" });
  const actions = el("div", { class: "row", style: "margin-top:10px" });
  actions.append(saveBtn, enableBtn);
  if (detail.adapter_type === "provider_api" || detail.adapter_type === "site_fetch" || detail.adapter_type === "static_url") {
    actions.append(el("button", { class: "btn", text: "立即抓取", type: "button",
      onclick: async () => {
        setMsg(msg, "抓取中…", "info");
        try {
          const res = await api("/api/v1/admin/sources/" + encodeURIComponent(id) + "/fetch", { method: "POST" });
          setMsg(msg, "抓取完成：" + JSON.stringify(res), "good");
          refreshCurrent();
        } catch (err) { setMsg(msg, "抓取失败：" + err.message, "err"); }
      } }));
  }
  if (detail.adapter_type === "custom") {
    actions.append(el("button", { class: "btn", text: "手动验活", type: "button",
      onclick: async () => {
        setMsg(msg, "已提交验活…", "info");
        try {
          await api("/api/v1/admin/sources/" + encodeURIComponent(id) + "/validate", { method: "POST" });
          setMsg(msg, "验活任务已启动。", "good");
        } catch (err) { setMsg(msg, "验活失败：" + err.message, "err"); }
      } }));
  }
  actions.append(delBtn);
  panel.append(cfgLabel, cfgBox, actions, msg);
  if (detail.adapter_type === "custom") {
    const importLabel = el("label", { text: "上传代理列表（追加，不覆盖；http:// 或 socks5:// [user:pass@]host:port）" });
    const importBox = el("textarea", { spellcheck: "false", placeholder: "http://1.2.3.4:8080" });
    const importBtn = el("button", { class: "btn primary", text: "解析并导入", type: "button" });
    const importMsg = el("div", { class: "msg" });
    importBtn.addEventListener("click", async () => {
      const content = importBox.value;
      if (!content.trim()) { setMsg(importMsg, "请先粘贴代理列表", "err"); return; }
      setMsg(importMsg, "导入中…", "info");
      try {
        const res = await api("/api/v1/admin/sources/" + encodeURIComponent(id) + "/imports", {
          method: "POST", headers: { "Content-Type": "text/plain" }, body: content });
        setMsg(importMsg, "导入完成：新增 " + res.added + "，更新 " + res.updated +
          "，重复 " + res.duplicate + "，拒绝 " + (res.rejected || 0), "good");
        importBox.value = "";
        refreshCurrent();
      } catch (err) { setMsg(importMsg, "导入失败：" + err.message, "err"); }
    });
    panel.append(el("div", { style: "margin-top:14px" }, importLabel, importBox, importBtn, importMsg));
  }
  saveBtn.addEventListener("click", async () => {
    let cfg;
    try { cfg = JSON.parse(cfgBox.value); }
    catch (e) { setMsg(msg, "配置不是合法 JSON：" + e.message, "err"); return; }
    setMsg(msg, "保存中…", "info");
    try {
      await api("/api/v1/admin/sources/" + encodeURIComponent(id), {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ config_version: sourceState.detail.config_version, config: cfg }) });
      setMsg(msg, "已保存。", "good");
      await paintSourceDetail();
      renderSources();
    } catch (err) {
      if (err.code === "SOURCE_VERSION_CONFLICT" || err.status === 409) {
        setMsg(msg, "保存冲突：配置已被他人修改（" + err.message + "）。已为你重新加载最新版本，请合并后重试。", "err");
        await paintSourceDetail();
      } else setMsg(msg, "保存失败：" + err.message, "err");
    }
  });
  enableBtn.addEventListener("click", async () => {
    setMsg(msg, "提交中…", "info");
    try {
      await api("/api/v1/admin/sources/" + encodeURIComponent(id), {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ config_version: sourceState.detail.config_version,
          enabled: !sourceState.detail.enabled }) });
      setMsg(msg, "已更新启停状态。", "good");
      await paintSourceDetail();
      renderSources();
    } catch (err) { setMsg(msg, "操作失败：" + err.message, "err"); }
  });
  delBtn.addEventListener("click", async () => {
    if (!confirm("删除渠道 " + id + "？其库存与资源会一并清理，且不可恢复。")) return;
    try {
      const res = await api("/api/v1/admin/sources/" + encodeURIComponent(id), { method: "DELETE" });
      setMsg(msg, "已删除（清理供给记录 " + res.removed_offers + " 条）。", "good");
      sourceState.selected = null;
      await renderSources();
      await paintSourceDetail();
    } catch (err) { setMsg(msg, "删除失败：" + err.message, "err"); }
  });
}

function buildSourceCreateForm(panel) {
  const msg = el("div", { class: "msg" });
  const idInput = el("input", { type: "text", placeholder: "小写字母数字，例如 upload-main", spellcheck: "false" });
  const kindSelect = el("select");
  const kindNote = el("p", { class: "muted", style: "font-size:12px" });
  const extra = el("div");
  function paintKind() {
    extra.textContent = "";
    const cap = sourceState.adapters.find((a) => a.id === kindSelect.value);
    kindNote.textContent = cap ? (cap.description + "；能力：" + cap.capabilities.join("、")) : "";
    const kind = kindSelect.value;
    if (kind === "provider_api") {
      const proto = el("select", {},
        el("option", { value: "http", text: "http" }),
        el("option", { value: "https", text: "https（CONNECT）" }),
        el("option", { value: "socks5", text: "socks5" }));
      proto.dataset.field = "protocol";
      const count = el("input", { type: "number", value: "20", min: "1", max: "20" });
      count.dataset.field = "fetch_count";
      const country = el("input", { type: "text", placeholder: "留空 = 不限" });
      country.dataset.field = "country_code";
      const interval = el("input", { type: "number", value: "0", min: "0" });
      interval.dataset.field = "min_fetch_interval_ms";
      extra.append(
        el("label", { text: "协议" }), proto,
        el("label", { text: "每次拉取数量（1-20）" }), count,
        el("label", { text: "国家代码（可选，两位）" }), country,
        el("label", { text: "最小拉取间隔（毫秒，0=适配器默认）" }), interval);
    } else if (kind === "site_fetch") {
      const site = el("select");
      site.dataset.field = "site_id";
      api("/api/v1/admin/sites").then((catalog) => {
        for (const s of catalog) site.append(el("option", { value: s.site_id, text: s.site_id + "（" + s.name + "）" }));
      }).catch(() => {});
      const pages = el("input", { type: "number", value: "1", min: "1" });
      pages.dataset.field = "max_pages";
      extra.append(el("label", { text: "站点" }), site,
        el("label", { text: "每次抓取页数" }), pages);
    } else if (kind === "static_url") {
      const url = el("input", { type: "text", placeholder: "https://example.com/proxies.txt" });
      url.dataset.field = "url";
      const transport = el("select", {},
        el("option", { value: "http", text: "http" }),
        el("option", { value: "socks5", text: "socks5" }));
      transport.dataset.field = "default_transport";
      extra.append(el("label", { text: "列表 URL（http/https）" }), url,
        el("label", { text: "列表内代理的传输类型" }), transport);
    } else {
      extra.append(el("p", { class: "muted", style: "font-size:12px", text: "上传渠道无需配置；创建后使用「上传代理列表」导入。" }));
    }
  }
  kindSelect.addEventListener("change", paintKind);
  const createBtn = el("button", { class: "btn primary", text: "创建渠道", type: "button" });
  createBtn.addEventListener("click", async () => {
    const id = idInput.value.trim();
    if (!id) { setMsg(msg, "请填写渠道 ID", "err"); return; }
    const kind = kindSelect.value;
    const fields = {};
    for (const node of extra.querySelectorAll("[data-field]")) {
      const key = node.dataset.field;
      const v = node.value.trim();
      if (v === "") continue;
      fields[key] = node.type === "number" ? Number(v) : v;
    }
    // The API accepts the typed SourceConfig only. Adapter type selects the
    // nested key (provider/site/static); this is a form adapter, not a
    // compatibility layer for the retired flat config shape.
    const configKey = { provider_api: "provider", site_fetch: "site", static_url: "static" }[kind];
    const cfg = configKey ? { [configKey]: fields } : {};
    setMsg(msg, "创建中…", "info");
    try {
      await api("/api/v1/admin/sources", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source_id: id, adapter_type: kind, config: cfg, enabled: true }) });
      setMsg(msg, "已创建 " + id + "。", "good");
      idInput.value = "";
      sourceState.selected = id;
      await renderSources();
      await paintSourceDetail();
    } catch (err) { setMsg(msg, "创建失败：" + err.message, "err"); }
  });
  panel.append(
    el("label", { text: "渠道 ID" }), idInput,
    el("label", { text: "适配器类型（能力固定，不可改）" }), kindSelect, kindNote,
    extra, createBtn, msg);
  api("/api/v1/admin/adapters").then((res) => {
    sourceState.adapters = res.adapters || [];
    for (const a of sourceState.adapters) {
      kindSelect.append(el("option", { value: a.id, text: a.id + "（" + a.kind + "）" }));
    }
    paintKind();
  });
}

let jobsTimer = null;

async function renderJobs() {
  const root = $("view-jobs");
  if (!root.dataset.built) {
    root.textContent = "";
    root.append(el("p", { class: "hint", text: "预热是异步任务：只刷新证据与健康，不发放代理、不写项目 CD。可取消；重启后任务标记为 INTERRUPTED，需重新发起。" }));
    const createPanel = el("div", { class: "panel" }, el("h2", { text: "发起预热任务" }));
    const subject = el("p", { class: "notice" });
    const count = el("input", { type: "number", value: "5", min: "1" });
    const timeout = el("input", { type: "number", value: "120", min: "1" });
    const btn = el("button", { class: "btn primary", text: "创建预热任务", type: "button" });
    const msg = el("div", { class: "msg" });
    btn.addEventListener("click", async () => {
      setMsg(msg, "创建中…", "info");
      try {
        const job = await api("/api/v1/prewarm", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ count: Number(count.value), timeout: Number(timeout.value) }) });
        setMsg(msg, "已创建任务 " + job.job_id + "（项目 " + job.project_id + "）。", "good");
        renderJobs();
      } catch (err) { setMsg(msg, "创建失败：" + err.message, "err"); }
    });
    createPanel.append(
      subject,
      el("div", { class: "row" },
        el("div", {}, el("label", { text: "目标达标数量" }), count),
        el("div", {}, el("label", { text: "任务预算（秒）" }), timeout)),
      btn, msg);
    api("/api/v1/admin/system").then((info) => {
      subject.textContent = "任务主体：当前管理登录所属的默认项目（" + (info.default_project_id || "default") +
        "）。Ready 只代表该项目在当前条件下的有效数量，不代表其他项目。";
    }).catch(() => {
      subject.textContent = "任务主体：当前管理登录所属的默认项目。Ready 只代表该项目的当前有效数量。";
    });
    const listPanel = el("div", { class: "panel" }, el("h2", { text: "任务列表" }));
    const projectFilter = el("input", { type: "text", placeholder: "按 project_id 过滤（留空 = 全部）" });
    projectFilter.addEventListener("change", () => loadJobs());
    const tbl = table([{ label: "任务" }, { label: "项目" }, { label: "状态" }, { label: "达标/目标" },
      { label: "探测/失败" }, { label: "停止原因" }, { label: "更新" }, { label: "操作" }]);
    const pagerBox = el("div");
    listPanel.append(projectFilter, tbl, pagerBox);
    root.append(createPanel, listPanel);
    root.dataset.built = "1";
    root._tbl = tbl;
    root._filter = projectFilter;
    root._pager = pager(pagerBox, () => root._jobs ? root._jobs.length : 0);
    root._pager.addEventListener("pagechange", () => paintJobs());
  }
  await loadJobs();
  if (!jobsTimer) jobsTimer = setInterval(() => { if (currentView === "jobs") loadJobs(); }, 5000);
}

async function loadJobs() {
  const root = $("view-jobs");
  const filter = root._filter.value.trim();
  const qs = new URLSearchParams({ limit: "200" });
  if (filter) qs.set("project_id", filter);
  const jobs = await api("/api/v1/admin/jobs?" + qs.toString());
  root._jobs = jobs || [];
  root._pager.go();
}

function paintJobs() {
  const root = $("view-jobs");
  const { page, size } = root._pager.page();
  const tbl = root._tbl;
  tbl.body.textContent = "";
  const rows = root._jobs.slice((page - 1) * size, page * size);
  if (!rows.length) tbl.body.append(el("tr", {}, el("td", { colspan: "8", class: "muted", text: "暂无任务" })));
  for (const j of rows) {
    const active = j.state === "PENDING" || j.state === "RUNNING";
    const cancelBtn = el("button", { class: "btn danger", text: "取消", type: "button",
      onclick: async () => {
        if (!confirm("取消任务 " + j.job_id + "？")) return;
        try {
          await api("/api/v1/jobs/" + encodeURIComponent(j.job_id) + "/cancel", { method: "POST" });
          loadJobs();
        } catch (err) { alert("取消失败：" + err.message); }
      } });
    if (!active) cancelBtn.disabled = true;
    tbl.body.append(el("tr", {},
      el("td", { class: "mono", text: j.job_id }),
      el("td", { class: "mono", text: j.project_id }),
      el("td", {}, jobBadge(j.state)),
      el("td", { class: "num", text: j.ready + "/" + j.target }),
      el("td", { class: "num", text: j.probed + " / " + j.failed }),
      el("td", { class: "muted", text: j.stop_reason || j.last_error || "—" }),
      el("td", { text: fmtTime(j.updated_at) }),
      el("td", {}, cancelBtn)));
  }
}

  tbl.body.textContent = "";
  const rows = projectState.list.slice((page - 1) * size, page * size);
  if (!rows.length) tbl.body.append(el("tr", {}, el("td", { colspan: "5", class: "muted", text: "暂无项目" })));
  for (const p of rows) {
    tbl.body.append(el("tr", { class: "click" + (projectState.selected === p.project_id ? " selected" : ""),
      onclick: () => selectProject(p.project_id) },
      el("td", { class: "mono", text: p.project_id }),
      el("td", { text: p.name }),
      el("td", {}, el("span", { class: p.enabled ? "ok" : "muted", text: p.enabled ? "启用" : "停用" })),
      el("td", { class: "num", text: (p.defaults.cooldown_ms / 1000) + "s" }),
      el("td", { class: "num", text: String(p.config_version) })));
  }
}

async function selectProject(id) {
  projectState.selected = id;
  paintProjectRows();
  await paintProjectDetail();
}

function scopeModeOf(list) {
  if (list === null || list === undefined) return "all";
  if (list.length === 0) return "none";
  return "custom";
}

  catch (err) { panel.append(el("div", { class: "bad", text: "读取失败：" + err.message })); return; }

  const versionTag = el("span", { class: "badge", text: "config_version " + p.config_version });

    el("option", { value: "false", text: "停用", selected: p.enabled ? undefined : "" }));
  const cd = el("input", { type: "number", value: String(p.defaults.cooldown_ms / 1000), min: "0" });

  const valTarget = el("input", { type: "text", value: (p.defaults.validation && p.defaults.validation.target_host_port) || "",

    const patch = { config_version: p.config_version, name: name.value.trim(),
      enabled: enabled.value === "true",
      cooldown_ms: Number(cd.value) * 1000, timeout_ms: Number(timeout.value) * 1000,
      validation: { mode: valMode.value } };
    if (valMode.value === "tls") patch.validation.target = valTarget.value.trim();
    setMsg(msg, "保存中…", "info");
    try {
      await api("/api/v1/admin/projects/" + encodeURIComponent(id), {
        method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(patch) });
      setMsg(msg, "已保存。", "good");
      await renderProjects();
      await paintProjectDetail();
    } catch (err) {
      if (err.code === "CONFIG_VERSION_CONFLICT" || err.status === 409) {
        setMsg(msg, "版本冲突：" + err.message + " 已重新加载最新配置，请合并后重试。", "err");
        await paintProjectDetail();

      await api("/api/v1/admin/projects/" + encodeURIComponent(id), { method: "DELETE" });

      el("div", {}, el("label", { text: "默认超时（秒）" }), timeout)),

    try {

        method: "POST", headers: { "Content-Type": "application/json" },

      tokenBox.hidden = false;
      tokenBox.textContent = "新密钥（仅本次显示）：" + res.token;
      keyName.value = "";
      loadProjectKeys();
    } catch (err) { setMsg(msg, "创建密钥失败：" + err.message, "err"); }
  });
  async function loadProjectKeys() {
    const keys = await api("/api/v1/admin/projects/" + encodeURIComponent(id) + "/keys");

        el("td", { text: k.name }),
        el("td", { class: "mono", text: k.token_prefix + "…" }),
        el("td", {}, el("span", { class: k.enabled ? "ok" : "muted", text: k.enabled ? "启用" : "停用" })),
        el("td", {}, el("button", { class: "btn danger", text: "删除", type: "button",
          onclick: async () => {
            if (!confirm("删除密钥 " + k.key_id + "？该项目已发放的 CD 不会被清除。")) return;

              await api("/api/v1/admin/keys/" + encodeURIComponent(k.key_id), { method: "DELETE" });

  const modeNone = el("input", { type: "radio", name: "scopeMode-" + id, value: "none" });
  const modeCustom = el("input", { type: "radio", name: "scopeMode-" + id, value: "custom" });
  const scopeList = el("textarea", { placeholder: "每行一个 source_id" });
  const currentMode = scopeModeOf(p.allowed_source_ids);
  ({ all: modeAll, none: modeNone, custom: modeCustom })[currentMode].checked = true;
  if (currentMode === "custom") scopeList.value = (p.allowed_source_ids || []).join("\n");
  const scopeSave = el("button", { class: "btn primary", text: "保存来源范围", type: "button" });
  scopeSave.addEventListener("click", async () => {
    const mode = [modeAll, modeNone, modeCustom].find((r) => r.checked).value;
    const body = { config_version: p.config_version, source_ids: null };
    if (mode === "none") body.source_ids = [];
    else if (mode === "custom") {
      body.source_ids = scopeList.value.split("\n").map((s) => s.trim()).filter(Boolean);
    }
    setMsg(msg, "保存中…", "info");
    try {
      await api("/api/v1/admin/projects/" + encodeURIComponent(id) + "/sources", {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      setMsg(msg, "来源范围已保存。", "good");
      await paintProjectDetail();
    } catch (err) {
      if (err.code === "CONFIG_VERSION_CONFLICT" || err.status === 409) {
        setMsg(msg, "版本冲突：" + err.message + " 请刷新后重试。", "err");

      } else setMsg(msg, "保存失败：" + err.message, "err");
    }
  });
  scopePanel.append(
    el("div", {}, modeAll, el("label", { text: "不限制（null）：可用全部渠道", style: "display:inline;margin-left:6px" })),
    el("div", {}, modeNone, el("label", { text: "全部拒绝（[]）：空允许列表", style: "display:inline;margin-left:6px" })),
    el("div", {}, modeCustom, el("label", { text: "自定义列表", style: "display:inline;margin-left:6px" })),
    scopeList, scopeSave);

  panel.append(cfgPanel, keysPanel, scopePanel, msg);
  loadProjectKeys();
}

  const tbl = table([{ label: "项目" }, { label: "会话" }, { label: "状态" }, { label: "版本" },
    { label: "来源" }, { label: "到期" }, { label: "操作" }]);

  panel.append(filter, tbl, pagerBox);
  root.append(panel);
  const pg = pager(pagerBox, () => root._list ? root._list.length : 0);
  async function load() {
    const qs = new URLSearchParams({ limit: "200" });
    if (filter.value.trim()) qs.set("project_id", filter.value.trim());
    root._list = (await api("/api/v1/admin/sessions?" + qs.toString())) || [];
    pg.go();
  }
  function paint() {
    const { page, size } = pg.page();
    tbl.body.textContent = "";

    if (!rows.length) tbl.body.append(el("tr", {}, el("td", { colspan: "7", class: "muted", text: "暂无绑定" })));
    for (const b of rows) {
      tbl.body.append(el("tr", {},

        el("td", { class: "mono", text: b.session_id }),
        el("td", {}, el("span", { class: b.state === "ACTIVE" ? "ok" : "muted", text: b.state })),
        el("td", { class: "num", text: String(b.version) }),
        el("td", { class: "mono", text: b.source_id || "—" }),
        el("td", { text: fmtTime(b.deadline) }),
        el("td", {}, el("button", { class: "btn danger", text: "释放", type: "button",

            if (!confirm("释放会话 " + b.session_id + "（项目 " + b.project_id + "）？")) return;
            try {
              await api("/api/v1/admin/projects/" + encodeURIComponent(b.project_id) +

              load();
            } catch (err) { alert("释放失败：" + err.message); }

  }
  pg.addEventListener("pagechange", paint);
  await load();
}

      el("td", { class: "muted", text: n.last_error || "—" })));
  }
  usagePanel.append(el("h2", { text: "最近通知", style: "margin-top:14px" }), nt);
}

/* ---------- 系统 ---------- */

async function renderSystem() {
  const root = $("view-system");
  root.textContent = "";
  root.append(el("p", { class: "hint", text: "运行版本与生效的安全上限。全部数值来自当前加载的配置。" }));
  const sys = await api("/api/v1/admin/system");
  const panel = el("div", { class: "panel" }, el("h2", { text: "版本与上限" }));
  panel.append(el("dl", { class: "kv" },
    el("dt", { text: "版本" }), el("dd", { class: "mono", text: sys.version || "dev" })));
  const limits = el("div", { class: "stats" });
  const limitNames = {
    max_count_per_request: "单次数量上限", max_acquire_deadline_ms: "请求预算上限(ms)",
    acquire_deadline_ms: "默认预算(ms)", max_downstream_cooldown_ms: "项目CD上限(ms)",
    prewarm_max_deadline_ms: "预热预算上限(ms)", job_max_active_per_project: "单项目任务上限",
    job_max_active_global: "全局任务上限", deployment_probe_slots: "部署探测并发",
    max_active_acquisitions: "取号并发上限", max_request_body_bytes: "请求体上限(bytes)",
  };
  for (const [k, label] of Object.entries(limitNames)) {
    limits.append(el("div", { class: "stat" },
      el("div", { class: "v", text: String(sys.limits[k]) }), el("div", { class: "k", text: label })));
  }
  panel.append(limits);
  const valPanel = el("div", { class: "panel" }, el("h2", { text: "验活与安全" }));
  valPanel.append(el("dl", { class: "kv" },
    el("dt", { text: "Judge 地址" }), el("dd", { class: "mono", text: sys.validation.judge_url_configured ? "已配置" : "未配置" }),
    el("dt", { text: "Judge 签名" }), el("dd", { class: "mono", text: sys.validation.judge_signed ? "启用" : "未启用" }),
    el("dt", { text: "允许私网目标" }), el("dd", { class: "mono", text: sys.validation.allow_private ? "是（仅测试环境）" : "否" }),
    el("dt", { text: "公网 HTTPS" }), el("dd", { class: "mono", text: sys.public_https ? "是" : "否" })));
  const dailyPanel = el("div", { class: "panel" }, el("h2", { text: "今日渠道验活统计" }));
  const dt = table([{ label: "渠道" }, { label: "代理数" }, { label: "通过" }, { label: "失败" }, { label: "成功率" }]);
  dailyPanel.append(dt);
  const daily = await api("/api/v1/admin/daily");
  if (!daily.length) dt.body.append(el("tr", {}, el("td", { colspan: "5", class: "muted", text: "今日暂无验活记录" })));
  for (const d of daily) {
    const total = d.total ?? (d.pass + d.fail);
    const rate = total ? Math.round(100 * (d.pass / total)) + "%" : "—";
    dt.body.append(el("tr", {},
      el("td", { class: "mono", text: d.source_id }),
      el("td", { class: "num", text: String(total) }),
      el("td", { class: "num", text: String(d.pass) }),
      el("td", { class: "num", text: String(d.fail) }),
      el("td", { class: "num", text: rate })));
  }
  root.append(panel, valPanel, dailyPanel);
}

/* ---------- 启动 ---------- */

async function bootstrap() {
  // A successful authenticated admin request proves that a cookie already
  // exists; otherwise api() has already shown the login overlay.
  try {
    await api("/api/v1/admin/projects");
    $("login").hidden = true;
    switchView("overview");
  } catch (_) {
    switchView("overview");
  }
}
bootstrap();
</script>
</body>
</html>
