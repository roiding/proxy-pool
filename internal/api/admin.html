<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proxy-pool 管理台</title>
<style>
:root {
  --bg: #f4f1ea; --panel: #fffdf8; --edge: #d8d2c4; --edge-strong: #b8b0a0;
  --ink: #26221a; --dim: #6f6a5e; --accent: #1f6f50; --accent-ink: #fffdf8;
  --warn: #9a6b1f; --bad: #a33d30; --info: #2b5d8a;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background:
    linear-gradient(180deg, #efe9dd 0%, transparent 240px),
    var(--bg);
  color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.6;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 20px; border-bottom: 1px solid var(--edge); background: var(--panel);
}
header h1 { font-size: 15px; margin: 0 12px 0 0; letter-spacing: .08em; font-family: var(--mono); }
header h1 b { color: var(--accent); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  border: 1px solid transparent; background: transparent; border-radius: 6px;
  padding: 5px 12px; cursor: pointer; color: var(--dim);
}
nav button:hover { color: var(--ink); background: #efe9dd; }
nav button[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }
header .spacer { flex: 1; }
header .ghost {
  border: 1px solid var(--edge-strong); background: transparent; border-radius: 6px;
  padding: 4px 12px; cursor: pointer; color: var(--dim);
}
header .ghost:hover { color: var(--ink); border-color: var(--ink); }
main { max-width: 1200px; margin: 0 auto; padding: 20px; }
section.view > p.hint { color: var(--dim); font-size: 12px; margin: 0 0 14px; }
.panel {
  background: var(--panel); border: 1px solid var(--edge); border-radius: 10px;
  padding: 16px; margin-bottom: 18px;
}
.panel h2 { font-size: 13px; margin: 0 0 12px; color: var(--dim); font-weight: 600; letter-spacing: .08em; }
.grid2 { display: grid; grid-template-columns: minmax(280px, 2fr) minmax(320px, 3fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
label { display: block; margin: 10px 0 3px; color: var(--dim); font-size: 12px; }
input[type=text], input[type=number], input[type=password], select, textarea {
  width: 100%; background: #fbf8f1; border: 1px solid var(--edge-strong);
  border-radius: 6px; padding: 7px 9px;
}
textarea { min-height: 96px; resize: vertical; font-family: var(--mono); font-size: 12px; }
.row { display: flex; gap: 10px; } .row > * { flex: 1; min-width: 0; }
.btn {
  border: 1px solid var(--edge-strong); background: var(--panel); border-radius: 6px;
  padding: 5px 14px; cursor: pointer;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger:hover { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table-wrap { width: 100%; min-width: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table .mono { overflow-wrap: anywhere; word-break: break-word; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--edge); vertical-align: top; }
th { color: var(--dim); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; font-family: var(--mono); }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: #f3efe5; }
tbody tr.selected { background: #e7efe9; }
tbody tr.group-row td { background: #f3efe5; color: var(--dim); font-weight: 600; padding-top: 10px; }
.mono { font-family: var(--mono); font-size: 12px; }
.ok { color: var(--accent); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--dim); }
.badge {
  display: inline-block; padding: 0 8px; border: 1px solid var(--edge-strong);
  border-radius: 10px; font-size: 11px; color: var(--dim); white-space: nowrap;
}
.badge.good { color: var(--accent); border-color: var(--accent); }
.badge.warn { color: var(--warn); border-color: var(--warn); }
.badge.bad { color: var(--bad); border-color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.stat { background: #fbf8f1; border: 1px solid var(--edge); border-radius: 8px; padding: 10px 12px; }
.stat .v { font-size: 20px; font-family: var(--mono); }
.stat .k { font-size: 11px; color: var(--dim); }
.notice {
  border: 1px dashed var(--edge-strong); border-radius: 8px; padding: 8px 12px;
  font-size: 12px; color: var(--dim); margin: 10px 0 0;
}
.msg { margin-top: 10px; font-size: 12px; min-height: 18px; }
.msg.err { color: var(--bad); } .msg.good { color: var(--accent); } .msg.info { color: var(--info); }
.pager { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--dim); }
.pager button { padding: 2px 10px; }
pre.json {
  background: #fbf8f1; border: 1px solid var(--edge); border-radius: 8px;
  padding: 10px; font-size: 12px; overflow: auto; max-height: 260px; font-family: var(--mono);
}
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 14px; font-size: 13px; }
.kv dt { color: var(--dim); } .kv dd { margin: 0; font-family: var(--mono); }
#login {
  position: fixed; inset: 0; background: rgba(40,36,28,.55);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
#login[hidden] { display: none !important; }
#login .panel { width: 100%; max-width: 360px; }
.clearrow { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--dim); }
.clearrow input { width: auto; }
.tokenbox { background: #efe9dd; border: 1px solid var(--warn); border-radius: 8px; padding: 10px; font-family: var(--mono); word-break: break-all; }
details.fold { margin-top: 10px; border-top: 1px solid var(--edge); padding-top: 8px; }
details.fold > summary { cursor: pointer; color: var(--dim); font-size: 12px; user-select: none; }
.field-hint { color: var(--dim); font-size: 11px; margin-top: 3px; }
.upload-panel { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.upload-zone { background: #fbf8f1; border: 1px solid var(--edge); border-radius: 8px; padding: 12px; }
.upload-zone h3 { font-size: 13px; margin: 0 0 6px; letter-spacing: .04em; }
.upload-zone input[type=file] {
  width: 100%; padding: 9px; background: var(--panel); border: 1px dashed var(--edge-strong);
  border-radius: 6px; cursor: pointer;
}
.upload-zone input[type=file]:focus-visible { outline: 2px solid var(--info); outline-offset: 1px; }
.import-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.import-errors { margin: 6px 0 0; padding-left: 20px; color: var(--bad); }
.import-errors li { margin: 2px 0; }
</style>
</head>
<body>
<header>
  <h1>proxy<b>-</b>pool 管理台</h1>
  <nav id="nav" aria-label="主导航"></nav>
  <span class="spacer"></span>
  <button class="ghost" id="refreshBtn">刷新</button>
  <button class="ghost" id="logoutBtn">退出</button>
</header>
<main>
  <section class="view" id="view-overview" hidden></section>
  <section class="view" id="view-sources" hidden></section>
  <section class="view" id="view-inventory" hidden></section>
  <section class="view" id="view-jobs" hidden></section>
  <section class="view" id="view-projects" hidden></section>
  <section class="view" id="view-sessions" hidden></section>
  <section class="view" id="view-alerts" hidden></section>
  <section class="view" id="view-system" hidden></section>
</main>
<div id="login" hidden>
  <div class="panel">
    <h2>管理登录</h2>
    <form id="loginForm">
      <label for="loginToken">管理密码（未配置 admin_password 时填 api_token）</label>
      <input type="password" id="loginToken" autocomplete="current-password" required>
      <div class="msg" id="loginMsg"></div>
      <div style="margin-top:12px"><button class="btn primary" type="submit">进入管理台</button></div>
    </form>
  </div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* ---------- 基础设施 ---------- */

async function api(path, opts = {}) {
  opts.credentials = "same-origin";
  opts.headers = Object.assign({}, opts.headers);
  if ((opts.method || "GET") !== "GET") opts.headers["X-PP-Admin"] = "1";
  const resp = await fetch(path, opts);
  if (resp.status === 401) { showLogin("会话已过期，请重新登录"); throw new Error("unauthorized"); }
  let data = null;
  const text = await resp.text();
  if (text) { try { data = JSON.parse(text); } catch (e) { data = null; } }
  if (!resp.ok) {
    const detail = data && data.error ? (data.error.code + ": " + data.error.message) : (text || resp.status);
    const err = new Error(detail);
    err.status = resp.status;
    err.code = data && data.error ? data.error.code : "";
    throw err;
  }
  return data;
}

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    if (k === "class") node.className = v;
    else if (k === "text") node.textContent = v;
    else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v);
  }
  for (const child of children) {
    if (child === null || child === undefined) continue;
    node.append(child);
  }
  return node;
}

function fmtTime(v) {
  if (!v) return "—";
  const d = new Date(v);
  return isNaN(d) ? String(v) : d.toLocaleString();
}

function setMsg(node, text, kind) {
  node.textContent = text;
  node.className = "msg " + (kind || "");
}

function jobBadge(state) {
  const cls = { COMPLETED: "good", PARTIAL: "warn", RUNNING: "warn", PENDING: "warn",
    FAILED: "bad", CANCELLED: "bad", INTERRUPTED: "bad" }[state] || "";
  return el("span", { class: "badge " + cls, text: state || "—" });
}

function pager(container, totalFn) {
  let page = 1;
  const size = 20;
  const info = el("span");
  const prev = el("button", { class: "btn", text: "上一页", onclick: () => { if (page > 1) { page--; render(); } } });
  const next = el("button", { class: "btn", text: "下一页", onclick: () => { page++; render(); } });
  const root = el("div", { class: "pager" }, prev, info, next);
  function render() {
    const total = totalFn();
    const pages = Math.max(1, Math.ceil(total / size));
    if (page > pages) page = pages;
    info.textContent = "第 " + page + " / " + pages + " 页，共 " + total + " 条";
    prev.disabled = page <= 1;
    next.disabled = page >= pages;
    root.dispatchEvent(new CustomEvent("pagechange", { detail: { page, size } }));
  }
  root.go = () => { page = 1; render(); };
  root.render = render;
  root.page = () => ({ page, size });
  container.append(root);
  return root;
}

function table(head) {
  const tbody = el("tbody");
  const node = el("table", {},
    el("thead", {}, el("tr", {}, ...head.map((h) =>
      el("th", { class: h.num ? "num" : "", text: h.label })))));
  node.append(tbody);
  const root = el("div", { class: "table-wrap" }, node);
  root.body = tbody;
  return root;
}

/* ---------- 登录 ---------- */

function showLogin(msg) {
  $("login").hidden = false;
  $("loginToken").focus();
  setMsg($("loginMsg"), msg || "", msg ? "err" : "");
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  try {
    const resp = await fetch("/admin/login", {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: $("loginToken").value }),
    });
    if (resp.ok) {
      $("loginToken").value = "";
      $("login").hidden = true;
      refreshCurrent();
    } else {
      setMsg($("loginMsg"), "登录失败：密码不正确", "err");
    }
  } catch (err) {
    setMsg($("loginMsg"), "登录请求失败：" + err.message, "err");
  }
});

$("logoutBtn").addEventListener("click", async () => {
  await fetch("/admin/logout", { method: "POST", credentials: "same-origin" }).catch(() => {});
  showLogin("已退出");
});

/* ---------- 导航 ---------- */

const VIEWS = [
  ["overview", "概览"], ["sources", "渠道"], ["inventory", "本地库存"],
  ["jobs", "任务"], ["projects", "下游项目"], ["sessions", "会话"],
  ["alerts", "流量告警"], ["system", "系统"],
];
let currentView = "overview";

for (const [id, label] of VIEWS) {
  const btn = el("button", {
    text: label, type: "button",
    onclick: () => switchView(id),
  });
  btn.dataset.view = id;
  $("nav").append(btn);
}

function switchView(id) {
  currentView = id;
  for (const [vid] of VIEWS) {
    $("view-" + vid).hidden = vid !== id;
  }
  for (const btn of $("nav").children) {
    if (btn.dataset.view === id) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  }
  refreshCurrent();
}

$("refreshBtn").addEventListener("click", refreshCurrent);

/* ---------- 视图刷新 ---------- */

function refreshCurrent() {
  const fn = { overview: renderOverview, sources: renderSources, inventory: renderInventory,
    jobs: renderJobs, projects: renderProjects, sessions: renderSessions,
    alerts: renderAlerts, system: renderSystem }[currentView];
  if (fn) Promise.resolve(fn()).catch((err) => {
    if (err.message !== "unauthorized") console.error(err);
  });
}

/* ---------- 概览 ---------- */

async function renderOverview() {
  const root = $("view-overview");
  root.textContent = "";
  root.append(el("p", { class: "hint", text: "实时取号表现、验证状态与最近任务。上传库存与网络缓存分开统计；网络通过数是已验活记录，不是上传资源数。" }));
  const statsPanel = el("div", { class: "panel" }, el("h2", { text: "池子状态" }));
  const statsBox = el("div", { class: "stats", text: "加载中…" });
  statsPanel.append(statsBox);
  const valPanel = el("div", { class: "panel" }, el("h2", { text: "定期验活" }));
  const valBox = el("div", { class: "muted", text: "加载中…" });
  valPanel.append(valBox);
  const jobsPanel = el("div", { class: "panel" }, el("h2", { text: "最近任务" }));
  const jobsBox = el("div", { text: "加载中…" });
  jobsPanel.append(jobsBox);
  root.append(statsPanel, el("div", { class: "grid2" }, valPanel, jobsPanel));
  const stats = await api("/api/v1/admin/stats");
  const channels = await api("/api/v1/admin/sources");
  const networkPassed = channels.reduce((n, s) => n + (s.cache?.fresh ? (s.cache.verified || 0) : 0), 0);
  const networkBlocked = channels.reduce((n, s) => n + (s.cache?.fresh ? (s.cache.blacklisted || 0) : 0), 0);
  statsBox.textContent = "";
  for (const [k, v] of [
    ["渠道实例", stats.sources], ["上传资源", stats.resources], ["启用上传库存", stats.enabled_offers],
    ["网络已通过（按渠道计）", networkPassed], ["网络黑名单（按渠道计）", networkBlocked],
    ["活跃租约", stats.active_leases], ["进行中预约", stats.active_reservations],
    ["验活通过次数", stats.attempt_pass ?? 0], ["验活失败次数", stats.attempt_fail ?? 0],
  ]) {
    statsBox.append(el("div", { class: "stat" },
      el("div", { class: "v", text: String(v) }), el("div", { class: "k", text: k })));
  }
  const val = await api("/api/v1/admin/validation");
  valBox.textContent = "";
  if (val.running) {
    valBox.append(el("div", { class: "warn", text: "验证进行中" + (val.source_id ? "（渠道 " + val.source_id + "）" : "（全部渠道）") }));
  } else if (val.last_finished_at) {
    valBox.append(el("div", { text: "上次完成：" + fmtTime(val.last_finished_at) }));
  } else {
    valBox.append(el("div", { class: "muted", text: "尚未运行验证（每晚自动一次，也可在渠道详情手动触发）" }));
  }
  valBox.append(el("div", { class: "muted", text: "探测 " + (val.probed ?? 0) + " · 清理 " + (val.retired ?? 0) }));
  const jobs = (await api("/api/v1/admin/jobs?limit=8")) || [];
  jobsBox.textContent = "";
  const jt = table([{ label: "任务" }, { label: "项目" }, { label: "状态" }, { label: "验活结果" }, { label: "更新" }]);
  if (!jobs.length) jt.body.append(el("tr", {}, el("td", { colspan: "5", class: "muted", text: "暂无任务" })));
  for (const j of jobs) {
    jt.body.append(el("tr", {},
      el("td", {}, el("div", { text: jobKindLabel(j) }), el("div", { class: "mono muted", text: j.job_id })),
      el("td", { class: "mono", text: j.project_id }),
      el("td", {}, jobBadge(j.state)),
      el("td", { class: "num", text: jobProgressText(j) }),
      el("td", { text: fmtTime(j.updated_at) })));
  }
  jobsBox.append(jt);
  const usage = await api("/api/v1/admin/usage").catch(() => null);
  if (usage) {
    const up = el("div", { class: "panel" }, el("h2", { text: "云用量（最近一次查询）" }));
    if (usage.snapshot) {
      up.append(el("div", {},
        el("span", { text: "已用 " + usage.snapshot.used_gb + " GB / " + usage.snapshot.total_gb + " GB · " }),
        usage.stale ? el("span", { class: "warn", text: "数据已过期" })
                    : el("span", { class: "ok", text: "数据时间 " + fmtTime(usage.snapshot.as_of) })));
    } else {
      up.append(el("div", { class: "muted", text: usage.last_error || "暂无用量数据（尚未取得官方流量口径）" }));
    }
    root.append(up);
  }
}

/* ---------- 渠道 ---------- */

const sourceState = { list: [], adapters: [], templates: [], selected: null, detail: null, requestSeq: 0 };
const LIST_ADAPTERS = new Set(["site_fetch", "static_url", "account_list", "provider_api"]);
const ADAPTER_LABELS = {
  custom: "上传代理列表", provider_api: "品牌 API 渠道", site_fetch: "站点列表",
  static_url: "通用静态列表", account_list: "账号列表",
};
const COUNTRY_CHOICES = [
  ["", "全球 / 不限"], ["CN", "中国"], ["US", "美国"], ["GB", "英国"], ["DE", "德国"], ["JP", "日本"],
  ["SG", "新加坡"], ["HK", "中国香港"], ["TW", "中国台湾"], ["KR", "韩国"], ["CA", "加拿大"],
  ["AU", "澳大利亚"], ["FR", "法国"], ["NL", "荷兰"], ["IN", "印度"], ["BR", "巴西"],
];
let channelFieldSeq = 0;
const channelStateText = (state) => ({ active: "可适配，待实测", paused: "暂停", awaiting_protocol: "待协议核验",
  awaiting_contract: "待厂商契约", awaiting_credentials: "待账号配置", incompatible: "TLS 契约不兼容", retired: "旧入口退役" }[state] || state || "未知");

function cloneObject(value) {
  try { return JSON.parse(JSON.stringify(value && typeof value === "object" ? value : {})); }
  catch (_) { return {}; }
}

function ensureOption(select, value, label) {
  if (![...select.options].some((option) => option.value === value)) {
    select.append(el("option", { value, text: label || value }));
  }
}

function field(labelText, control, hintText) {
  if (!control.id) control.id = "channel-field-" + (++channelFieldSeq);
  const box = el("div", {}, el("label", { text: labelText, for: control.id }), control);
  if (hintText) box.append(el("div", { class: "field-hint", text: hintText }));
  return box;
}

function sourceCacheText(source) {
  if (!LIST_ADAPTERS.has(source.adapter_type)) return "上传 " + String(source.enabled_offers ?? 0);
  const cache = source.cache || {};
  return String(cache.candidates ?? 0) + " / " + String(cache.verified ?? 0) + " / " + String(cache.blacklisted ?? 0);
}

const IMPORT_MAX_BYTES = 8 << 20;
const IMPORT_MAX_ITEMS = 10000;
let sourceImportSeq = 0;

function nextUploadSourceID(sources) {
  const used = new Set((sources || []).map((source) => source.source_id));
  const base = "my-proxies";
  if (!used.has(base)) return base;
  for (let suffix = 2; suffix < 10000; suffix++) {
    const candidate = base + "-" + suffix;
    if (!used.has(candidate)) return candidate;
  }
  return "my-proxies-" + Date.now().toString(36);
}

function uploadContentType(fileName, content) {
  const name = String(fileName || "").toLowerCase();
  if (name.endsWith(".json")) return "application/json";
  if (name.endsWith(".txt")) return "text/plain";
  return String(content || "").trimStart().startsWith("{") ? "application/json" : "text/plain";
}

function importItemCount(contentType, content) {
  if (contentType === "application/json") {
    try {
      const body = JSON.parse(content);
      return Array.isArray(body?.items) ? body.items.length : 0;
    } catch (_) {
      return 0;
    }
  }
  return String(content || "").split(/\r?\n/).reduce((count, line) => {
    const value = line.trim();
    return count + (value && !value.startsWith("#") ? 1 : 0);
  }, 0);
}

function importErrorItems(container, errors, contentType) {
  container.textContent = "";
  const list = Array.isArray(errors) ? errors : [];
  if (!list.length) return;
  const shown = list.slice(0, 5);
  const items = shown.map((item) => {
    const position = Number(item.index ?? item.line);
    const unit = contentType === "text/plain" ? " 行" : " 项";
    const where = Number.isInteger(position) && position > 0 ? "第 " + position + unit : "某项";
    return el("li", { text: where + "：" + String(item.error || "无法解析") });
  });
  if (list.length > shown.length) {
    items.push(el("li", { text: "另有 " + (list.length - shown.length) + " 条错误未展开" }));
  }
  container.append(el("ul", { class: "import-errors" }, ...items));
}

function buildSourceImporter(options = {}) {
  const uid = "source-import-" + (++sourceImportSeq);
  const fixedSourceID = options.fixedSourceID || "";
  const title = options.title || "上传自己的资源";
  const description = options.description ||
    "选择 TXT 列表或 JSON 文件，也可以直接粘贴；导入会追加合并库存，不覆盖已有资源。";
  const targetSelect = el("select", { id: uid + "-target", "aria-describedby": uid + "-target-hint" });
  const targetHint = el("div", { class: "field-hint", id: uid + "-target-hint",
    text: "只显示可导入的上传渠道；已停用的上传渠道需先在详情启用。" });
  const targetBox = el("div", {}, el("label", { for: targetSelect.id, text: "上传到" }),
    targetSelect, targetHint);
  const newID = el("input", { type: "text", id: uid + "-new-id", spellcheck: "false",
    autocomplete: "off", "aria-describedby": uid + "-new-id-hint" });
  const newIDHint = el("div", { class: "field-hint", id: uid + "-new-id-hint",
    text: "使用小写字母、数字、下划线或短横线；创建后立即启用并导入。" });
  const newBox = el("div", {}, el("label", { for: newID.id, text: "新上传渠道 ID" }),
    newID, newIDHint);
  const fileInput = el("input", { type: "file", id: uid + "-file",
    accept: ".txt,.json,text/plain,application/json", "aria-describedby": uid + "-file-hint" });
  const fileHint = el("div", { class: "field-hint", id: uid + "-file-hint",
    text: "支持 .txt（每行一个代理）和 .json；单个文件最大 8 MiB、最多 10000 条。选择后会读入下方文本框，可先核对再导入。" });
  const textArea = el("textarea", { id: uid + "-text", spellcheck: "false",
    "aria-describedby": uid + "-text-hint",
    placeholder: "http://user:pass@1.2.3.4:8080\nsocks5://5.6.7.8:1080\n\n也可粘贴 {\"items\": [...]} 格式的 JSON" });
  const textHint = el("div", { class: "field-hint", id: uid + "-text-hint",
    text: "可粘贴代理 URI 列表或 JSON；空行及以 # 开头的行会忽略。" });
  const submitBtn = el("button", { class: "btn primary", type: "button" });
  const clearBtn = el("button", { class: "btn", type: "button", text: "清空输入" });
  const msg = el("div", { class: "msg", role: "status", "aria-live": "polite" });
  const errorBox = el("div");
  const fileStatus = el("div", { class: "field-hint", "aria-live": "polite" });
  const actions = el("div", { class: "import-actions" }, submitBtn, clearBtn);
  const node = el("div", { class: "upload-zone" },
    el("h3", { text: title }),
    el("p", { class: "notice", text: description }),
    fixedSourceID ? null : targetBox,
    fixedSourceID ? null : newBox,
    el("label", { for: fileInput.id, text: "从本地选择文件" }),
    fileInput, fileHint, fileStatus,
    el("label", { for: textArea.id, text: fixedSourceID ? "或粘贴代理列表 / JSON" : "或直接粘贴代理列表 / JSON" }),
    textArea, textHint, actions, msg, errorBox);

  let contentType = "text/plain";
  let fileName = "";
  let suggestedID = "";
  let busy = false;
  let reading = false;
  let fileReadSeq = 0;
  let fixedEnabled = !fixedSourceID;

  function syncControls() {
    submitBtn.disabled = busy || reading || !fixedEnabled;
    clearBtn.disabled = busy || reading;
    fileInput.disabled = busy;
    textArea.disabled = busy;
    targetSelect.disabled = busy || !!fixedSourceID;
    newID.disabled = busy || !!fixedSourceID;
    syncActionLabel();
  }

  function setBusy(value) {
    busy = value;
    syncControls();
  }

  function setReading(value) {
    reading = value;
    syncControls();
  }

  function syncActionLabel() {
    const creating = !fixedSourceID && targetSelect.value === "__new__";
    submitBtn.textContent = busy ? "导入中…" : (reading ? "读取文件中…" : (creating ? "创建并导入" : "追加导入"));
  }

  function updateTargetBox() {
    if (fixedSourceID) return;
    const creating = targetSelect.value === "__new__";
    newBox.hidden = !creating;
    syncActionLabel();
  }

  function refreshTargets(sources, preferredID) {
    if (fixedSourceID) return;
    const previous = preferredID || targetSelect.value;
    const currentDraft = newID.value.trim();
    const previousSuggestion = suggestedID;
    const all = Array.isArray(sources) ? sources : [];
    const customs = all.filter((source) => source.adapter_type === "custom");
    const enabledCustoms = customs.filter((source) => source.enabled);
    targetSelect.textContent = "";
    targetSelect.append(el("option", { value: "__new__", text: "新建上传渠道并导入" }));
    for (const source of enabledCustoms) {
      targetSelect.append(el("option", { value: source.source_id,
        text: "追加到 " + source.source_id + "（" + String(source.enabled_offers ?? 0) + " 条启用库存）" }));
    }
    for (const source of customs.filter((item) => !item.enabled)) {
      targetSelect.append(el("option", { value: source.source_id, disabled: "",
        text: source.source_id + "（已停用，先在详情启用）" }));
    }
    const selectable = new Set(["__new__", ...enabledCustoms.map((source) => source.source_id)]);
    targetSelect.value = selectable.has(previous) ? previous : "__new__";
    if (newID.value.trim() === previousSuggestion || !currentDraft) {
      suggestedID = nextUploadSourceID(all);
      newID.value = suggestedID;
    }
    fixedEnabled = true;
    updateTargetBox();
    setBusy(busy);
  }

  function resetInput() {
    fileReadSeq++;
    reading = false;
    textArea.value = "";
    fileInput.value = "";
    fileName = "";
    contentType = "text/plain";
    fileStatus.textContent = "";
    errorBox.textContent = "";
    syncControls();
  }

  function validateContent() {
    const content = textArea.value;
    if (!content.trim()) return { error: "请选择文件或粘贴代理列表" };
    if (new Blob([content]).size > IMPORT_MAX_BYTES) return { error: "内容超过 8 MiB，请拆分后分批导入" };
    contentType = uploadContentType(fileName, content);
    if (importItemCount(contentType, content) > IMPORT_MAX_ITEMS) {
      return { error: "内容超过 10000 条，请拆分后分批导入" };
    }
    return { content, contentType };
  }

  async function importContent(content, kind, targetID) {
    setMsg(msg, "导入中…", "info");
    errorBox.textContent = "";
    const res = await api("/api/v1/admin/sources/" + encodeURIComponent(targetID) + "/imports", {
      method: "POST", headers: { "Content-Type": kind }, body: content,
    });
    const rejected = Number(res.rejected || 0);
    const errors = Array.isArray(res.errors) ? res.errors : [];
    importErrorItems(errorBox, errors, kind);
    const summary = "导入完成：新增 " + Number(res.added || 0) + "，更新 " + Number(res.updated || 0) +
      "，重复 " + Number(res.duplicate || 0) + "，拒绝 " + (rejected || errors.length) + "。";
    if (rejected > 0 || errors.length > 0) {
      setMsg(msg, summary + " 被拒绝的内容仍在输入框中，可修正后重试。", "warn");
    } else {
      setMsg(msg, summary + " 已有库存保持不变。", "good");
      resetInput();
    }
    return res;
  }

  targetSelect.addEventListener("change", updateTargetBox);
  newID.addEventListener("input", () => {
    if (newID.value.trim() !== suggestedID) suggestedID = "";
  });
  textArea.addEventListener("input", () => {
    fileReadSeq++;
    reading = false;
    fileName = "";
    contentType = uploadContentType("", textArea.value);
    fileInput.value = "";
    fileStatus.textContent = "";
    syncControls();
  });
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files && fileInput.files[0];
    if (!file) return;
    const seq = ++fileReadSeq;
    if (file.size > IMPORT_MAX_BYTES) {
      setReading(false);
      setMsg(msg, "文件超过 8 MiB，请拆分后分批导入。原输入未改动。", "err");
      return;
    }
    setReading(true);
    fileStatus.textContent = "正在读取 " + file.name + "…";
    try {
      const content = await file.text();
      if (seq !== fileReadSeq) return;
      textArea.value = content;
      fileName = file.name;
      contentType = uploadContentType(file.name, content);
      fileStatus.textContent = "已读取 " + file.name + "（" + Math.ceil(file.size / 1024) + " KiB）";
      errorBox.textContent = "";
      setMsg(msg, "文件内容已读入文本框，请核对后导入。", "info");
    } catch (err) {
      if (seq !== fileReadSeq) return;
      fileName = "";
      fileStatus.textContent = "";
      setMsg(msg, "读取文件失败：" + err.message + "。原输入未改动。", "err");
    } finally {
      if (seq === fileReadSeq) setReading(false);
    }
  });
  clearBtn.addEventListener("click", () => {
    if (busy) return;
    resetInput();
    setMsg(msg, "", "");
  });
  submitBtn.addEventListener("click", async () => {
    if (busy) return;
    const checked = validateContent();
    if (checked.error) { setMsg(msg, checked.error, "err"); return; }
    const creating = !fixedSourceID && targetSelect.value === "__new__";
    const id = fixedSourceID || (creating ? newID.value.trim() : targetSelect.value);
    if (!creating && !sourceState.list.some((source) =>
      source.source_id === id && source.adapter_type === "custom" && source.enabled)) {
      setMsg(msg, "所选上传渠道当前不可用，请刷新后重试。原输入已保留。", "err");
      return;
    }
    if (creating) {
      if (!/^[a-z0-9][a-z0-9_-]{0,63}$/.test(id)) {
        setMsg(msg, "渠道 ID 需使用小写字母、数字、下划线或短横线，且以字母或数字开头。", "err");
        return;
      }
      const occupied = sourceState.list.find((source) => source.source_id === id);
      if (occupied) {
        setMsg(msg, "渠道 ID “" + id + "” 已被现有" +
          (occupied.adapter_type === "custom" ? "上传渠道" : "渠道") +
          "使用，请换一个 ID，或选择上方已有上传渠道。", "err");
        return;
      }
    }
    setBusy(true);
    let createdID = "";
    try {
      if (creating) {
        setMsg(msg, "正在创建上传渠道…", "info");
        await api("/api/v1/admin/sources", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ source_id: id, adapter_type: "custom",
            config: { default_transport: "http" }, enabled: true }),
        });
        createdID = id;
        await renderSources({ refreshDetail: false });
        refreshTargets(sourceState.list, id);
      }
      await importContent(checked.content, checked.contentType, id);
      await renderSources({ refreshDetail: false });
      if (createdID) refreshTargets(sourceState.list, createdID);
    } catch (err) {
      setMsg(msg, (createdID ? "渠道已创建，但导入失败：" : "导入失败：") +
        err.message + "。原输入已保留。", "err");
    } finally {
      setBusy(false);
    }
  });

  if (fixedSourceID) {
    fixedEnabled = !!(sourceState.list.find((source) =>
      source.source_id === fixedSourceID && source.adapter_type === "custom" && source.enabled));
    if (!fixedEnabled) {
      msg.className = "msg warn";
      msg.textContent = "该上传渠道已停用，请先在详情启用后导入。";
    }
    setBusy(false);
  } else {
    refreshTargets(sourceState.list, "__new__");
  }
  return { node, refreshTargets };
}

function sourceUploadPanel() {
  const importer = buildSourceImporter({
    title: "上传自己的资源",
    description: "不用先创建品牌或网络渠道。选择 TXT / JSON 文件或直接粘贴，即可新建上传渠道或追加到已有上传渠道；库存只合并不覆盖。无需上传密钥，管理登录即可导入。",
  });
  const panel = el("div", { class: "panel upload-panel" },
    el("h2", { text: "直接导入代理资源" }),
    el("p", { class: "notice", text: "上传资源会追加合并到库存，不覆盖已有记录；候选耗尽时等待新资源，缓存更新或上传资源后再继续。" }),
    importer.node);
  return { panel, importer };
}

function siteConfigChoices(currentSiteID) {
  const choices = new Map();
  const brand = sourceState.templates.find((template) => templateVariants(template).some((variant) => variant.config?.site?.site_id === currentSiteID));
  for (const template of brand ? [brand] : sourceState.templates) {
    for (const variant of templateVariants(template)) {
      const siteID = variant.config?.site?.site_id;
      if (!siteID) continue;
      choices.set(siteID, {
        value: siteID,
        label: (template.brand || template.name || template.id) + " · " + (variant.name || variant.id) +
          "（" + transportText(variant.transports) + "）",
      });
    }
  }
  return [...choices.values()];
}

function buildChannelConfigEditor(adapterType, initialConfig) {
  let currentAdapter = adapterType || "custom";
  let sourceConfig = cloneObject(initialConfig);
  const simple = el("div");
  const advancedBody = el("div");
  const diagnostics = el("pre", { class: "json" });
  const root = el("div");
  let controls = {};

  function configValue() {
    const cfg = cloneObject(sourceConfig);
    if (currentAdapter === "provider_api") {
      cfg.provider = cfg.provider && typeof cfg.provider === "object" ? cfg.provider : {};
      cfg.provider.vendor_id = cfg.provider.vendor_id || "scdn";
      cfg.provider.protocol = controls.protocol?.value || "http";
      const fetchCount = Number(controls.fetchCount?.value || 0);
      if (fetchCount > 0) cfg.provider.fetch_count = Math.trunc(fetchCount);
      else delete cfg.provider.fetch_count;
      const country = String(controls.country?.value || "").trim().toUpperCase();
      if (country) cfg.provider.country_code = country;
      else delete cfg.provider.country_code;
      const intervalSec = Number(controls.intervalSec?.value || 0);
      if (intervalSec > 0) cfg.provider.min_fetch_interval_ms = Math.trunc(intervalSec * 1000);
      else delete cfg.provider.min_fetch_interval_ms;
    } else if (currentAdapter === "site_fetch") {
      cfg.site = cfg.site && typeof cfg.site === "object" ? cfg.site : {};
      cfg.site.site_id = controls.siteID?.value || "";
      const maxPages = Number(controls.maxPages?.value || 0);
      if (maxPages > 0) cfg.site.max_pages = Math.trunc(maxPages);
      else delete cfg.site.max_pages;
    } else if (currentAdapter === "static_url") {
      cfg.static = cfg.static && typeof cfg.static === "object" ? cfg.static : {};
      cfg.static.url = String(controls.url?.value || "").trim();
      cfg.static.default_transport = controls.transport?.value || "http";
    } else if (currentAdapter === "account_list") {
      cfg.account = cfg.account && typeof cfg.account === "object" ? cfg.account : {};
      cfg.account.vendor_id = cfg.account.vendor_id || "webshare";
      cfg.account.protocol = controls.protocol?.value || "http";
    } else {
      cfg.default_transport = controls.transport?.value || "http";
    }

    if (LIST_ADAPTERS.has(currentAdapter) && controls.maxCandidates) {
      const maxCandidates = Number(controls.maxCandidates.value || 0);
      if (maxCandidates > 0) {
        cfg.refresh = cfg.refresh && typeof cfg.refresh === "object" ? cfg.refresh : { mode: "demand" };
        cfg.refresh.max_candidates = Math.trunc(maxCandidates);
      } else if (cfg.refresh && typeof cfg.refresh === "object") {
        delete cfg.refresh.max_candidates;
      }
    }

    const scopeMode = controls.scopeMode?.value || "public";
    if (scopeMode === "public") {
      delete cfg.access;
    } else {
      cfg.access = cfg.access && typeof cfg.access === "object" ? cfg.access : {};
      cfg.access.project_ids = scopeMode === "custom"
        ? [...new Set(String(controls.projectIDs?.value || "").split("\n").map((id) => id.trim()).filter(Boolean))]
        : [];
    }
    return cfg;
  }

  function validateConfig() {
    if (currentAdapter === "provider_api") {
      if (!["http", "https", "socks5"].includes(controls.protocol?.value)) return "请选择支持的代理协议";
      const count = Number(controls.fetchCount?.value || 0);
      if (!Number.isInteger(count) || count < 1 || count > 20) return "单次拉取数需为 1–20";
      const country = String(controls.country?.value || "").trim().toUpperCase();
      if (country && !/^[A-Z]{2}$/.test(country)) return "国家/地区请填写两位代码，例如 US";
      const intervalSec = Number(controls.intervalSec?.value || 0);
      if (!Number.isFinite(intervalSec) || intervalSec < 0 || intervalSec > 86400) return "最短拉取间隔需在 0–86400 秒";
    }
    if (currentAdapter === "site_fetch") {
      if (!controls.siteID?.value) return "请选择站点配置选项";
      const pages = Number(controls.maxPages?.value || 0);
      if (!Number.isInteger(pages) || pages < 0 || pages > 20) return "最多页数需为 0–20（0 使用渠道默认）";
    }
    if (currentAdapter === "static_url" && !String(controls.url?.value || "").trim()) return "请填写静态列表 URL";
    if (currentAdapter === "account_list" && !["http", "socks5"].includes(controls.protocol?.value)) {
      return "协议需为 HTTP 或 SOCKS5";
    }
    if (controls.maxCandidates) {
      const maxCandidates = Number(controls.maxCandidates.value || 0);
      if (maxCandidates && (!Number.isInteger(maxCandidates) || maxCandidates < 1 || maxCandidates > 1000)) {
        return "最大缓存条数需为 1–1000";
      }
    }
    if (currentAdapter === "account_list" && controls.scopeMode?.value === "public") {
      return "账号渠道必须显式选择允许项目，不能设为公开";
    }
    return "";
  }

  function syncDiagnostics() {
    diagnostics.textContent = JSON.stringify(configValue(), null, 2);
  }

  function paint(nextAdapter, nextConfig) {
    currentAdapter = nextAdapter || "custom";
    sourceConfig = cloneObject(nextConfig);
    simple.textContent = "";
    advancedBody.textContent = "";
    controls = {};

    if (currentAdapter === "provider_api") {
      const provider = sourceConfig.provider || {};
      const protocol = el("select", {},
        el("option", { value: "http", text: "HTTP" }),
        el("option", { value: "https", text: "HTTP CONNECT" }),
        el("option", { value: "socks5", text: "SOCKS5" }));
      ensureOption(protocol, provider.protocol || "http", String(provider.protocol || "http").toUpperCase());
      protocol.value = provider.protocol || "http";
      const fetchCount = el("input", { type: "number", min: "1", max: "20", step: "1",
        value: String(provider.fetch_count || 20) });
      const countryID = "country-options-" + (++channelFieldSeq);
      const country = el("input", { type: "text", list: countryID, value: provider.country_code || "",
        placeholder: "可选，例如 US", autocomplete: "off" });
      const countryList = el("datalist", { id: countryID },
        ...COUNTRY_CHOICES.map(([value, label]) => el("option", { value, text: label })));
      controls.protocol = protocol;
      controls.fetchCount = fetchCount;
      controls.country = country;
      simple.append(
        field("协议", protocol),
        field("单次拉取数", fetchCount, "SCDN 上游单次限制 1–20"),
        field("国家 / 地区（可选）", country, "可输入两位国家代码"), countryList);
      const intervalSec = el("input", { type: "number", min: "0", max: "86400", step: "1",
        value: String(Math.round((provider.min_fetch_interval_ms || 0) / 1000)) });
      controls.intervalSec = intervalSec;
      advancedBody.append(field("最短拉取间隔（秒，0 = 使用默认）", intervalSec));
    } else if (currentAdapter === "site_fetch") {
      const site = sourceConfig.site || {};
      const siteID = el("select");
      for (const choice of siteConfigChoices(site.site_id)) siteID.append(el("option", { value: choice.value, text: choice.label }));
      ensureOption(siteID, site.site_id || "", site.site_id || "请选择站点");
      siteID.value = site.site_id || "";
      const maxPages = el("input", { type: "number", min: "0", max: "20", step: "1",
        value: String(site.max_pages || 0) });
      controls.siteID = siteID;
      controls.maxPages = maxPages;
      simple.append(
        field("配置选项（品牌 / 站点 / 协议）", siteID),
        field("最多页数", maxPages, "0 使用渠道默认；上限 20 页"));
    } else if (currentAdapter === "static_url") {
      const stat = sourceConfig.static || {};
      const url = el("input", { type: "text", value: stat.url || "", placeholder: "https://example.com/list.txt", spellcheck: "false" });
      const transport = el("select", {},
        el("option", { value: "http", text: "HTTP" }),
        el("option", { value: "socks5", text: "SOCKS5" }));
      transport.value = stat.default_transport || "http";
      controls.url = url;
      controls.transport = transport;
      simple.append(field("列表 URL", url), field("默认协议", transport));
    } else if (currentAdapter === "account_list") {
      const account = sourceConfig.account || {};
      const protocol = el("select", {},
        el("option", { value: "http", text: "HTTP" }),
        el("option", { value: "socks5", text: "SOCKS5" }));
      protocol.value = account.protocol || "http";
      controls.protocol = protocol;
      simple.append(field("协议", protocol), el("p", { class: "notice",
        text: "账号 API Key 在下方专用区域加密填写，不会写入渠道配置。" }));
    } else {
      const transport = el("select", {},
        el("option", { value: "http", text: "HTTP" }),
        el("option", { value: "socks5", text: "SOCKS5" }));
      transport.value = sourceConfig.default_transport || "http";
      controls.transport = transport;
      simple.append(field("默认协议", transport));
    }

    if (LIST_ADAPTERS.has(currentAdapter)) {
      const maxCandidates = el("input", { type: "number", min: "1", max: "1000", step: "1",
        value: String(sourceConfig.refresh?.max_candidates || "") });
      controls.maxCandidates = maxCandidates;
      advancedBody.append(field("最大缓存条数", maxCandidates, "留空使用默认上限；范围 1–1000"));
    }

    const projectIDs = sourceConfig.access?.project_ids;
    const scopeMode = el("select");
    if (currentAdapter !== "account_list") {
      scopeMode.append(el("option", { value: "public", text: "公开（仍受下游项目允许范围限制）" }));
    }
    scopeMode.append(
      el("option", { value: "none", text: "不允许任何项目" }),
      el("option", { value: "custom", text: "指定项目" }));
    if (projectIDs == null) scopeMode.value = currentAdapter === "account_list" ? "none" : "public";
    else if (projectIDs.length === 0) scopeMode.value = "none";
    else scopeMode.value = "custom";
    const projectIDBox = el("textarea", { placeholder: "每行一个项目 ID" });

        : "不展开修改时会保留原范围。"),

  }

  root.addEventListener("input", syncDiagnostics);
  root.addEventListener("change", syncDiagnostics);
  paint(currentAdapter, sourceConfig);
  return {
    node: root,
    update: paint,
    value: configValue,
    validate: validateConfig,
  };
}

function templateVariants(template) {
  if (Array.isArray(template?.variants)) return template.variants.filter((variant) => variant?.config);
  if (template?.config) {
    return [{ id: template.config?.site?.site_id || template.id, name: template.name || template.id,
      transports: template.transports || [], config: template.config, parser_version: template.parser_version }];
  }
  return [];
}

function uniqueTransports(values) {
  const out = [];
  for (const value of values || []) {
    const transport = String(value || "").trim().toLowerCase();
    if (transport && !out.includes(transport)) out.push(transport);
  }
  return out.sort((a, b) => {
    const rank = { http: 0, socks5: 1 };
    return (rank[a] ?? 99) - (rank[b] ?? 99) || a.localeCompare(b);
  });
}

function templateTransports(template) {
  const values = [...(template?.transports || [])];
  for (const variant of templateVariants(template)) values.push(...(variant.transports || []));
  return uniqueTransports(values);
}

function transportText(transports) {
  return uniqueTransports(transports).map((transport) => transport.toUpperCase()).join(" / ") || "—";
}

function templateSummary(template) {
  if (template?.adapter_type === "provider_api") return "品牌 API 渠道，由后台统一维护缓存与验活。";
  if (template?.adapter_type === "account_list") return "读取已分配代理，账号 Key 独立加密保存。";
  if (template?.adapter_type === "site_fetch") return "公开站点列表，由后台统一维护缓存。";
  return "网络渠道，由后台统一维护缓存。";
}

function adapterForConfig(config) {
  if (config?.provider) return "provider_api";
  if (config?.site) return "site_fetch";
  if (config?.static) return "static_url";
  if (config?.account) return "account_list";
  return "custom";
}

function suggestedSourceID(template, variant) {
  if (variant?.config?.site) return variant.id;
  return template.id + "-" + variant.id;
}

function findTemplateVariant(detail) {
  const siteID = detail?.config?.site?.site_id;
  if (siteID) {
    for (const template of sourceState.templates) {
      const variant = templateVariants(template).find((item) => item.config?.site?.site_id === siteID);
      if (variant) return { template, variant };
    }
  }
  const account = detail?.config?.account;
  if (account?.vendor_id && account?.protocol) {
    for (const template of sourceState.templates) {
      const variant = templateVariants(template).find((item) => {
        const candidate = item.config?.account;
        return candidate?.vendor_id === account.vendor_id && candidate?.protocol === account.protocol;
      });
      if (variant) return { template, variant };
    }
  }
  const provider = detail?.config?.provider;
  if (provider?.protocol) {
    for (const template of sourceState.templates) {
      const variant = templateVariants(template).find((item) => {
        const candidate = item.config?.provider;
        return candidate && (candidate.vendor_id || "scdn") === (provider.vendor_id || "scdn") &&
          candidate.protocol === provider.protocol;
      });
      if (variant) return { template, variant };
    }
  }
  for (const template of sourceState.templates) {
    const variant = templateVariants(template).find((item) =>
      detail?.source_id === item.id || detail?.source_id === template.id + "-" + item.id);
    if (variant) return { template, variant };
  }
  return null;
}

function sourceGroup(s) {
  const id = String(s.channel_id || "").trim() || s.source_id;
  const name = String(s.channel_name || "").trim() || s.source_id;
  return { id, name };
}

function groupedSourceRows() {
  const groups = new Map();
  for (const source of sourceState.list) {
    const identity = sourceGroup(source);
    if (!groups.has(identity.id)) groups.set(identity.id, { identity, rows: [] });
    groups.get(identity.id).rows.push(source);
  }
  return [...groups.values()]
    .sort((a, b) => a.identity.name.localeCompare(b.identity.name, "zh-CN"))
    .flatMap((group) => {
      const rows = group.rows.sort((a, b) => a.source_id.localeCompare(b.source_id));
      return rows.map((source) => ({ group: { identity: group.identity, count: rows.length }, source }));
    });
}

      keyInfo.textContent = (status.configured ? "已配置，密钥版本 " + status.secret_version : "尚未配置") +
        (status.encryption_ready ? "；部署加密已启用。" : "；请先在部署配置设置 secret_encryption_key（至少 32 字节），绝不能使用明文配置替代。");
      rotate.disabled = !status.encryption_ready;
      if (!detail.enabled && !status.configured) enableBtn.disabled = true;
    }).catch((err) => { keyInfo.textContent = "状态读取失败：" + err.message; });
  }
  if (detail.adapter_type === "custom") {
    const importer = buildSourceImporter({
      fixedSourceID: id,
      title: "向此渠道添加资源",
      description: "选择 TXT / JSON 文件或直接粘贴，追加合并到当前上传渠道，不覆盖已有库存。",
    });
    panel.append(el("div", { style: "margin-top:14px" }, importer.node));
  }
  saveBtn.addEventListener("click", async () => {
    const validationError = editor.validate();
    if (validationError) { setMsg(msg, validationError, "err"); return; }
    const cfg = editor.value();
    setMsg(msg, "保存中…", "info");
    try {
      await api("/api/v1/admin/sources/" + encodeURIComponent(id), {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ config_version: detail.config_version, config: cfg }) });
      await renderSources();
      if (sourceState.selected === id) await paintSourceDetail("已保存。开启项目自动维持后，后台会按新设置补充。", undefined, "good");
    } catch (err) {
      if (err.code === "SOURCE_VERSION_CONFLICT" || err.status === 409) {
        setMsg(msg, "保存冲突：配置已被他人修改（" + err.message + "）。已为你重新加载最新版本，请合并后重试。", "err");
        if (sourceState.selected === id) await paintSourceDetail("保存冲突：已重新加载最新版本，请合并后重试。");
      } else setMsg(msg, "保存失败：" + err.message, "err");
    }
  });
  enableBtn.addEventListener("click", async () => {
    setMsg(msg, "提交中…", "info");
    try {
      await api("/api/v1/admin/sources/" + encodeURIComponent(id), {
        method: "PATCH", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ config_version: detail.config_version,
          enabled: !detail.enabled }) });
      await renderSources();
      if (sourceState.selected === id) await paintSourceDetail("已更新启停状态；后台会自动维护启用渠道的缓存与验活。", undefined, "good");
    } catch (err) { setMsg(msg, "操作失败：" + err.message, "err"); }
  });
  delBtn.addEventListener("click", async () => {
    if (!confirm("删除渠道 " + id + "？其库存与资源会一并清理，且不可恢复。")) return;
    try {
      const res = await api("/api/v1/admin/sources/" + encodeURIComponent(id), { method: "DELETE" });
      setMsg(msg, "已删除（清理供给记录 " + res.removed_offers + " 条）。", "good");
      sourceState.selected = null;
      await renderSources();
      await paintSourceDetail();
    } catch (err) { setMsg(msg, "删除失败：" + err.message, "err"); }
  });
}

function buildSourceCreateForm(panel) {
  const msg = el("div", { class: "msg" });
  const idInput = el("input", { type: "text", placeholder: "小写渠道 ID，例如 openproxy-http", spellcheck: "false" });
  const templateSelect = el("select", {}, el("option", { value: "", text: "选择品牌模板" }));
  const variantSelect = el("select", { disabled: "" });
  const kindSelect = el("select");
  const kindNote = el("p", { class: "notice", text: "加载代码注册表与模板…" });
  const editorHost = el("div");
  let editor = buildChannelConfigEditor("custom", { default_transport: "http" });
  editorHost.append(editor.node);
  let suggestedID = "";
  const defaults = { custom: { default_transport: "http" }, provider_api: { provider: { vendor_id: "scdn", protocol: "http", fetch_count: 20 } },
    site_fetch: { site: { site_id: "openproxylist-http", max_pages: 1 }, refresh: { mode: "demand", max_candidates: 1000 } },
    static_url: { static: { url: "https://example.com/list.txt", default_transport: "http" }, refresh: { mode: "demand", max_candidates: 1000 } },
    account_list: { account: { vendor_id: "webshare", protocol: "http", mode: "direct", page_size: 100, max_pages: 10 },
      access: { project_ids: [] }, refresh: { mode: "demand", cache_ttl_ms: 1800000, max_candidates: 1000 } } };
  function selectedTemplate() {
    return sourceState.templates.find((template) => template.id === templateSelect.value);
  }
  function selectedVariant(template = selectedTemplate()) {
    return templateVariants(template).find((variant) => variant.id === variantSelect.value);
  }
  function updateNote() {
    const template = selectedTemplate();
    const variant = selectedVariant(template);
    if (template && variant) {
      kindNote.textContent = (template.brand || template.name || template.id) + " · " + (variant.name || variant.id) +
        "（" + transportText(variant.transports) + "）。状态：" + channelStateText(template.state) + "。";
    } else {
      kindNote.textContent = (ADAPTER_LABELS[kindSelect.value] || "渠道") + "。选择品牌和配置选项可快速填入常用设置。";
    }
    if (kindSelect.value === "account_list") {
      kindNote.textContent += " API Key 在创建后的专用区域加密填写，不会写入渠道配置。";
    } else if (kindSelect.value === "provider_api") {
      kindNote.textContent += " 后台会统一维护缓存与验活。";
    }
  }
  function paintVariants(template) {
    variantSelect.textContent = "";
    const variants = templateVariants(template);
    if (!template) {
      variantSelect.append(el("option", { value: "", text: "先选择品牌模板" }));
      variantSelect.disabled = true;
      updateNote();
      return;
    }
    if (!variants.length) {
      variantSelect.append(el("option", { value: "", text: "该品牌暂无可用配置" }));
      variantSelect.disabled = true;
      updateNote();
      return;
    }
    for (const variant of variants) {
      variantSelect.append(el("option", { value: variant.id,
        text: (variant.name || variant.id) + " · " + transportText(variant.transports) }));
    }
    variantSelect.disabled = false;
    variantSelect.value = variants[0].id;
    applyVariant(template, variants[0]);
  }
  function applyVariant(template, variant) {
    if (!template || !variant) return;
    const adapter = adapterForConfig(variant.config);
    const config = cloneObject(variant.config ?? template.config ?? {});
    if (adapter === "provider_api" && config.provider) config.provider.fetch_count = 20;
    kindSelect.value = adapter;
    editor.update(adapter, config);
    const nextID = suggestedSourceID(template, variant);
    if (!idInput.value.trim() || idInput.value.trim() === suggestedID) {
      idInput.value = nextID;
      suggestedID = nextID;
    }
    updateNote();
  }
  idInput.addEventListener("input", () => {
    if (idInput.value.trim() !== suggestedID) suggestedID = "";
  });
  kindSelect.addEventListener("change", () => {
    templateSelect.value = "";
    paintVariants(null);
    editor.update(kindSelect.value, defaults[kindSelect.value] || {});
    updateNote();
  });
  templateSelect.addEventListener("change", () => {
    paintVariants(selectedTemplate());
  });
  variantSelect.addEventListener("change", () => {
    const template = selectedTemplate();
    applyVariant(template, selectedVariant(template));
  });
  const createBtn = el("button", { class: "btn primary", text: "创建渠道", type: "button", onclick: async () => {
    const id = idInput.value.trim();
    if (!id) { setMsg(msg, "请填写渠道 ID", "err"); return; }
    const validationError = editor.validate();
    if (validationError) { setMsg(msg, validationError, "err"); return; }
    const config = editor.value();
    const adapterType = adapterForConfig(config);
    if (adapterType !== kindSelect.value) { setMsg(msg, "表单配置与渠道类型不一致，请重新选择。", "err"); return; }
    createBtn.disabled = true;
    try {
      await api("/api/v1/admin/sources", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ source_id: id, adapter_type: adapterType, config, enabled: false }) });
      setMsg(msg, "", "good");
      idInput.value = ""; suggestedID = ""; templateSelect.value = ""; paintVariants(null);
      sourceState.selected = id;
      await renderSources(); await paintSourceDetail("已创建停用渠道。如需账号 Key，请在详情中填写后启用。", undefined, "good");
    } catch (err) { setMsg(msg, "创建失败：" + err.message, "err"); }
    finally { createBtn.disabled = false; }
  }});
  panel.append(el("label", { text: "渠道 ID（每个实例独立 source_id）" }), idInput,
    el("label", { text: "品牌" }), templateSelect,
    el("label", { text: "配置选项（协议 / 站点 / 账号）" }), variantSelect,
    el("label", { text: "渠道类型" }), kindSelect, kindNote,
    editorHost,
    el("p", { class: "notice", text: "创建后默认停用，可在详情启用。高级设置通常无需修改；网络渠道由后台统一维护缓存与验活。" }),
    createBtn, msg);
  Promise.all([api("/api/v1/admin/adapters"), api("/api/v1/admin/channel-templates")]).then(([registry, catalog]) => {
    sourceState.adapters = registry.adapters || []; sourceState.templates = catalog.templates || [];
    for (const adapter of sourceState.adapters) {
      kindSelect.append(el("option", { value: adapter.id,
        text: (ADAPTER_LABELS[adapter.id] || adapter.id) + "（" + adapter.id + "）" }));
    }
    for (const template of sourceState.templates) {
      const variants = templateVariants(template);
      if (!variants.length) continue;
      templateSelect.append(el("option", { value: template.id,
        text: (template.brand || template.name || template.id) + " · " + variants.length + " 个配置选项" }));
    }
    kindSelect.value = "custom";
    paintVariants(null);
    editor.update("custom", defaults.custom);
    updateNote();
  }).catch((err) => { kindNote.textContent = "模板加载失败：" + err.message; createBtn.disabled = true; });
}

let jobsTimer = null;

async function renderJobs() {
  const root = $("view-jobs");
  if (!root.dataset.built) {
    root.textContent = "";
    root.append(el("p", { class: "hint", text: "项目开启自动维持后，所有启用且该项目有权使用的网络渠道会共同补足目标。任务页可手动发起补充并验活，结果按渠道记录。" }));
    const createPanel = el("div", { class: "panel" }, el("h2", { text: "发起预热任务" }));
    const subject = el("p", { class: "notice" });
    const count = el("input", { type: "number", value: "1", min: "1" });
    const timeout = el("input", { type: "number", value: "120", min: "1" });
    const sourceIDs = el("input", { type: "text", placeholder: "逐渠道验收填一个 source_id；逗号可分隔，留空才使用项目范围" });
    const mode = el("select", {}, el("option", { value: "basic", text: "basic · 签名 Judge" }), el("option", { value: "tls", text: "tls · 目标端到端 TLS" }));
    const target = el("input", { type: "text", placeholder: "example.com:443（tls 模式必填）" }); target.disabled = true;
    mode.addEventListener("change", () => { target.disabled = mode.value !== "tls"; });
    const btn = el("button", { class: "btn primary", text: "创建预热任务", type: "button" });
    const msg = el("div", { class: "msg" });
    btn.addEventListener("click", async () => {
      setMsg(msg, "创建中…", "info");
      try {
        const job = await api("/api/v1/prewarm", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ count: Number(count.value), timeout: Number(timeout.value),
            ...(sourceIDs.value.trim() ? { source_ids: sourceIDs.value.split(",").map((s) => s.trim()).filter(Boolean) } : {}),
            validation: mode.value === "tls" ? { mode: "tls", target: target.value.trim() } : { mode: "basic" } }) });
        setMsg(msg, "已创建任务 " + job.job_id + "（项目 " + job.project_id + "）。", "good");
        renderJobs();
      } catch (err) { setMsg(msg, "创建失败：" + err.message, "err"); }
    });
    createPanel.append(
      subject,
      el("div", { class: "row" },
        el("div", {}, el("label", { text: "目标达标数量" }), count),
        el("div", {}, el("label", { text: "任务预算（秒）" }), timeout)),
      el("label", { text: "限定渠道（留空使用全部）" }), sourceIDs,
      el("div", { class: "row" }, mode, target),
      el("p", { class: "notice", text: "自动维持目标在「下游项目」设置，0 表示关闭。手动任务使用当前项目有权使用的渠道，未达标会如实报告短缺。" }),
      btn, msg);
    api("/api/v1/admin/system").then((info) => {
      subject.textContent = "任务主体：当前管理登录所属的默认项目（" + (info.default_project_id || "default") +
        "）。Ready 只代表该项目在当前条件下的有效数量，不代表其他项目。";
    }).catch(() => {
      subject.textContent = "任务主体：当前管理登录所属的默认项目。Ready 只代表该项目的当前有效数量。";
    });
    const listPanel = el("div", { class: "panel" }, el("h2", { text: "任务列表" }));
    const projectFilter = el("input", { type: "text", placeholder: "按 project_id 过滤（留空 = 全部）" });
    projectFilter.addEventListener("change", () => loadJobs());
    const tbl = table([{ label: "任务 / 类型" }, { label: "项目" }, { label: "状态" }, { label: "验活结果 / 抓取数" },
      { label: "探测/失败" }, { label: "停止原因" }, { label: "更新" }, { label: "操作" }]);
    const pagerBox = el("div");
    listPanel.append(projectFilter, tbl, pagerBox);
    root.append(createPanel, listPanel);
    root.dataset.built = "1";
    root._tbl = tbl;
    root._filter = projectFilter;
    root._pager = pager(pagerBox, () => root._jobs ? root._jobs.length : 0);
    root._pager.addEventListener("pagechange", () => paintJobs());
  }
  await loadJobs();
  if (!jobsTimer) jobsTimer = setInterval(() => { if (currentView === "jobs") loadJobs(); }, 5000);
}

async function loadJobs() {
  const root = $("view-jobs");
  const filter = root._filter.value.trim();
  const qs = new URLSearchParams({ limit: "200" });
  if (filter) qs.set("project_id", filter);
  const jobs = await api("/api/v1/admin/jobs?" + qs.toString());
  root._jobs = jobs || [];
  root._pager.go();
}

function paintJobs() {
  const root = $("view-jobs");
  const { page, size } = root._pager.page();
  const tbl = root._tbl;
  tbl.body.textContent = "";
  const rows = root._jobs.slice((page - 1) * size, page * size);
  if (!rows.length) tbl.body.append(el("tr", {}, el("td", { colspan: "8", class: "muted", text: "暂无任务" })));
  for (const j of rows) {
    const active = j.state === "PENDING" || j.state === "RUNNING";
    const cancelBtn = el("button", { class: "btn danger", text: "取消", type: "button",
      onclick: async () => {
        if (!confirm("取消任务 " + j.job_id + "？")) return;
        try {
          await api("/api/v1/jobs/" + encodeURIComponent(j.job_id) + "/cancel", { method: "POST" });
          loadJobs();
        } catch (err) { alert("取消失败：" + err.message); }
      } });
    if (!active) cancelBtn.disabled = true;
    tbl.body.append(el("tr", {},
      el("td", {}, el("div", { text: jobKindLabel(j) }), el("div", { class: "mono muted", text: j.job_id })),
      el("td", { class: "mono", text: j.project_id }),
      el("td", {}, jobBadge(j.state)),
      el("td", { class: "num", text: jobProgressText(j) }),
      el("td", { class: "num", text: j.probed + " / " + j.failed }),
      el("td", { class: "muted", text: jobStopReasonText(j) }),
      el("td", { text: fmtTime(j.updated_at) }),
      el("td", {}, cancelBtn)));
  }
}

function scopeModeOf(list) {
  if (list === null || list === undefined) return "all";
  if (list.length === 0) return "none";
  return "custom";
}

async function paintProjectDetail(errText, msgKind = "err") {
  const panel = $("view-projects")._detail;
  panel.textContent = "";
  panel.append(el("h2", { text: "项目详情" }));
  if (!projectState.selected) {
    panel.append(el("div", { class: "muted", text: "左侧选择项目。" }));
    return;
  }
  const id = projectState.selected;
  const msg = el("div", { class: "msg" });
  if (errText) setMsg(msg, errText, msgKind);
  let p;
  try { p = await api("/api/v1/admin/projects/" + encodeURIComponent(id)); }
  catch (err) { panel.append(el("div", { class: "bad", text: "读取失败：" + err.message })); return; }
  projectState.detail = p;
  const versionTag = el("span", { class: "badge", text: "config_version " + p.config_version });

  const cfgPanel = el("div");
  const name = el("input", { type: "text", value: p.name });
  const enabled = el("select", {},
    el("option", { value: "true", text: "启用", selected: p.enabled ? "" : undefined }),

async function renderSessions() {
  const root = $("view-sessions");
  root.textContent = "";
  root.append(el("p", { class: "hint", text: "粘性会话绑定按项目隔离。释放绑定不清除项目 CD；绑定到期自动失效。" }));
  const panel = el("div", { class: "panel" }, el("h2", { text: "粘性绑定" }));
  const filter = el("input", { type: "text", placeholder: "按 project_id 过滤（留空 = 全部）" });
  filter.addEventListener("change", () => load());
  const tbl = table([{ label: "项目" }, { label: "会话" }, { label: "状态" }, { label: "版本" },
    { label: "来源" }, { label: "到期" }, { label: "操作" }]);
  const pagerBox = el("div");
  panel.append(filter, tbl, pagerBox);
  root.append(panel);
  const pg = pager(pagerBox, () => root._list ? root._list.length : 0);
  async function load() {
    const qs = new URLSearchParams({ limit: "200" });
    if (filter.value.trim()) qs.set("project_id", filter.value.trim());
    root._list = (await api("/api/v1/admin/sessions?" + qs.toString())) || [];
    pg.go();
  }
  function paint() {
    const { page, size } = pg.page();
    tbl.body.textContent = "";
    const rows = root._list.slice((page - 1) * size, page * size);
    if (!rows.length) tbl.body.append(el("tr", {}, el("td", { colspan: "7", class: "muted", text: "暂无绑定" })));
    for (const b of rows) {
      tbl.body.append(el("tr", {},
        el("td", { class: "mono", text: b.project_id }),
        el("td", { class: "mono", text: b.session_id }),
        el("td", {}, el("span", { class: b.state === "ACTIVE" ? "ok" : "muted", text: b.state })),
        el("td", { class: "num", text: String(b.version) }),
        el("td", { class: "mono", text: b.source_id || "—" }),
        el("td", { text: fmtTime(b.deadline) }),
        el("td", {}, el("button", { class: "btn danger", text: "释放", type: "button",
          onclick: async () => {
            if (!confirm("释放会话 " + b.session_id + "（项目 " + b.project_id + "）？")) return;
            try {
              await api("/api/v1/admin/projects/" + encodeURIComponent(b.project_id) +
                "/sessions/" + encodeURIComponent(b.session_id), { method: "DELETE" });
              load();
            } catch (err) { alert("释放失败：" + err.message); }
          } }))));
    }
  }
  pg.addEventListener("pagechange", paint);
  await load();
}

function jobProgressText(j) {
  if (j.kind === "source_refresh") return (j.stop_reason === "cache_reused" ? "复用 " : "拉取 ") + j.ready + " 条缓存（未验活）";
  const running = j.state === "RUNNING" || j.state === "PENDING";
  const progress = "本次通过 " + Math.max(0, j.probed - j.failed) + "、失败 " + j.failed +
    "；" + (running ? "当前" : "结束时") + "待下发 " + j.ready + "/" + j.target;
  return j.stop_reason === "inventory_exhausted" ? progress + "；候选已耗尽" : progress;
}

function jobKindLabel(j) {
  if (j.kind === "source_refresh") return "缓存刷新";
  if (j.kind === "prewarm") return j.automatic ? "自动补足" : "手动预热";
  return j.kind;
}

function jobStopReasonText(j) {
  if (j.stop_reason === "inventory_exhausted") {
    return "候选耗尽，等待新资源；缓存更新或上传资源后再继续";
  }
  return j.stop_reason || j.last_error || "—";
}

/* ---------- 系统 ---------- */

async function renderSystem() {
  const root = $("view-system");
  root.textContent = "";
  root.append(el("p", { class: "hint", text: "运行版本与生效的安全上限。全部数值来自当前加载的配置。" }));
  const sys = await api("/api/v1/admin/system");
  const panel = el("div", { class: "panel" }, el("h2", { text: "版本与上限" }));
  panel.append(el("dl", { class: "kv" },
    el("dt", { text: "版本" }), el("dd", { class: "mono", text: sys.version || "dev" })));
  const limits = el("div", { class: "stats" });
  const limitNames = {
    max_count_per_request: "单次数量上限", max_acquire_deadline_ms: "请求预算上限(ms)",
    acquire_deadline_ms: "默认预算(ms)", max_downstream_cooldown_ms: "项目CD上限(ms)",
    prewarm_max_deadline_ms: "预热预算上限(ms)", job_max_active_per_project: "单项目任务上限",
    job_max_active_global: "全局任务上限", deployment_probe_slots: "部署探测并发",
    max_active_acquisitions: "取号并发上限", max_request_body_bytes: "请求体上限(bytes)",
  };
  for (const [k, label] of Object.entries(limitNames)) {
    limits.append(el("div", { class: "stat" },
      el("div", { class: "v", text: String(sys.limits[k]) }), el("div", { class: "k", text: label })));
  }
  panel.append(limits);
  const valPanel = el("div", { class: "panel" }, el("h2", { text: "验活与安全" }));
  valPanel.append(el("dl", { class: "kv" },
    el("dt", { text: "Judge 地址" }), el("dd", { class: "mono", text: sys.validation.judge_url_configured ? "已配置" : "未配置" }),
    el("dt", { text: "Judge 签名" }), el("dd", { class: "mono", text: sys.validation.judge_signed ? "启用" : "未启用" }),
    el("dt", { text: "允许私网目标" }), el("dd", { class: "mono", text: sys.validation.allow_private ? "是（仅测试环境）" : "否" }),
    el("dt", { text: "公网 HTTPS" }), el("dd", { class: "mono", text: sys.public_https ? "是" : "否" })));
  const dailyPanel = el("div", { class: "panel" }, el("h2", { text: "今日渠道验活统计" }));
  const dt = table([{ label: "渠道" }, { label: "代理数" }, { label: "通过" }, { label: "失败" }, { label: "成功率" }]);
  dailyPanel.append(dt);
  const daily = await api("/api/v1/admin/daily");
  if (!daily.length) dt.body.append(el("tr", {}, el("td", { colspan: "5", class: "muted", text: "今日暂无验活记录" })));
  for (const d of daily) {
    const total = d.total ?? (d.pass + d.fail);
    const rate = total ? Math.round(100 * (d.pass / total)) + "%" : "—";
    dt.body.append(el("tr", {},
      el("td", { class: "mono", text: d.source_id }),
      el("td", { class: "num", text: String(total) }),
      el("td", { class: "num", text: String(d.pass) }),
      el("td", { class: "num", text: String(d.fail) }),
      el("td", { class: "num", text: rate })));
  }
  root.append(panel, valPanel, dailyPanel);
}

/* ---------- 启动 ---------- */

async function bootstrap() {
  // A successful authenticated admin request proves that a cookie already
  // exists; otherwise api() has already shown the login overlay.
  try {
    await api("/api/v1/admin/projects");
    $("login").hidden = true;
    switchView("overview");
  } catch (_) {
    switchView("overview");
  }
}
bootstrap();
</script>
